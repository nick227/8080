name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_secret
          MYSQL_DATABASE: voice_chat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Server tests wipe every table, so vitest only runs against TEST_DATABASE_URL and
      # refuses to start if it equals DATABASE_URL. Nothing in CI uses DATABASE_URL itself.
      DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/voice_chat_unused
      TEST_DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/voice_chat_test
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; a second pin here makes the action fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Compares the committed generated types against the spec. Don't regenerate first,
      # or the check compares the output with itself and can never fail.
      - name: Check SDK drift
        run: pnpm sdk:check

      - name: Push DB schema
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # Server suite only: the web package's Playwright specs need browsers and running
      # servers, so they are not part of this gate.
      - name: Server tests
        run: pnpm --filter server test

      # What Railway runs for the web service (type-check, then vite build).
      - name: Web production build
        run: pnpm --filter web build
