# Workflows (doc/08 §4.2). Step types: wait · guard · choose · act · branch.
# Guards/acts are a typed registry in code; packs only compose them.
# In a workspace channel the host workflows welcome people (doc/12 §3), so the
# chatter here stays out of it; a summon still gets an answer.
- id: greet
  on: [member.joined, presence.arrived]
  key: "greet"                      # one live greet per room; arrivals during
  steps:                            # `collect` merge into it (burst → one line)
    - wait: { min: 2s, max: 8s, collect: 6s }
    - guard: [seated, notWorkspaceChannel, roomHasHumanItem, subjectsPresent, { notGreetedWithin: 12h }]
    - choose: { pool: "greeting.{audience}" }
    - act: { say: chat }

- id: opening
  on: [item.created]
  when: { firstHumanItem: true }
  key: "opening:{roomId}"
  once: true                        # persisted in BotOnce; never re-armed
  steps:
    - wait: { min: 2s, max: 5s }
    - guard: [seated, notWorkspaceChannel, { authorIsOwner: { final: true } }]
    - choose: { pool: opening }
    - act: { say: chat }

- id: answerSummon
  on: [item.created]
  when: { mentions: self, actor: human }
  key: "summon:{itemId}"
  steps:
    - wait: { min: 1.5s, max: 4s }
    - guard: [seated, itemLive, notWorkflowAnswer]
    - branch:                       # "chatbot, play something" → a clip on stage
        if: [{ intent: media-request }]
        then:
          - choose: { from: assets, pool: clips }
          - act: { place: stage, asReply: true }
        else:
          - choose: { pool: summon, byIntents: true, fallback: smalltalk }
          - act: { reply: sameSurface }

- id: idleNudge
  on: [room.idle]                   # no human post for BOT_IDLE_SEC while someone is here
  key: "idle"
  steps:
    - wait: { min: 1s, max: 4s }
    - guard: [seated, notWorkspaceChannel, humanPresent, roomHasHumanItem, { probability: 0.6 }]
    - branch:
        if: [{ probability: 0.3 }]
        then:
          - choose: { from: assets, pool: clips }
          - act: { place: stage }
        else:
          - choose: { pool: starter }
          - act: { say: chat }
