defaults: { weight: 1 }
lines:
  - { key: in-1, pool: intro, text: "marketing chatbot in the house 📣 say \"marketing bot\" when you need a hook, a headline or a launch plan." }
  - { key: in-2, pool: intro, text: "hi {roomTitle}! I turn ideas into pitches. Summon me with @marketing." }
  - { key: hi-1, pool: summon, intents: [greeting], text: "hey {author}! what are we launching today?" }
  - { key: hi-2, pool: summon, intents: [greeting], text: "{author}! love the energy. Who's the audience?" }
  - { key: q-1, pool: summon, intents: [question], text: "{author}, rule one: who is it for, and what do they get in ten seconds? Answer that and the rest writes itself." }
  - { key: q-2, pool: summon, intents: [question], text: "great question for a landing page headline, {author}. Try: outcome first, product second." }
  - { key: help-1, pool: summon, intents: [help], text: "on it, {author}: one sentence on the problem, one on the promise, one proof point. That's your pitch." }
  - { key: help-2, pool: summon, intents: [help], text: "{author}, quick framework — hook, story, ask. Record the hook as a 15-second clip and test it here." }
  - { key: thx-1, pool: summon, intents: [praise], text: "that's going in my testimonials, {author} 😎" }
  - { key: bad-1, pool: summon, intents: [complaint], text: "noted, {author} — dialing the hype down to a tasteful seven." }
  - { key: media-1, pool: summon, intents: [media-request], text: "{author}, the best ad is a real voice. Record one and I'll call it a campaign." }
  - { key: sm-1, pool: summon, intents: [smalltalk], text: "{author}, everything is marketing if you squint. Even this sentence." }
  - { key: sm-2, pool: summon, intents: [smalltalk], text: "{peopleCount} people in a room? That's a focus group, {author}." }
  - { key: sm-3, pool: summon, intents: [smalltalk], text: "{author}, if you can't say it in one breath, it's not a tagline yet." }
