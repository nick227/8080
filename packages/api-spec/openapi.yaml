    EmailConnection:
      type: object
      required: [id, mode, strategy, label, displayName, fromAddress, replyTo, status, isDefault, lastTestedAt, lastError, smtp]
      properties:
        id: { type: string }
        mode: { type: string, enum: [platform, own], description: 'What the UI offers: "Send with 8080" or "Use my own email/domain"' }
        strategy: { type: string, enum: [platform, smtp, google, microsoft, resend_domain], description: How an own sender connects }
        label: { type: string, description: 'Ready to show, e.g. "Send with 8080"' }
        displayName: { type: string, description: The name recipients see }
        fromAddress: { type: [string, 'null'], description: Null when the platform address is not configured }
        replyTo: { type: [string, 'null'] }
        status: { type: string, enum: [active, needs_attention, disabled] }
        isDefault: { type: boolean }
        lastTestedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        smtp:
          description: How an own SMTP sender connects (never the password); null otherwise
          oneOf:
            - type: 'null'
            - type: object
              required: [host, port, security, username]
              properties:
                host: { type: string }
                port: { type: integer }
                security: { $ref: '#/components/schemas/SmtpSecurity' }
                username: { type: string }

    EmailConnectionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/EmailConnection' }

    EmailConnectionListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EmailConnection' } }

    SmtpSecurity:
      type: string
      enum: [starttls, implicit]
      description: starttls = upgrade after connecting (port 587); implicit = TLS from the start (port 465)

    SmtpSettings:
      type: object
      additionalProperties: false
      required: [host, port, security, username, password]
      properties:
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, enum: [25, 465, 587, 2525] }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 500, writeOnly: true }

    CreateEmailConnectionInput:
      type: object
      additionalProperties: false
      required: [strategy, displayName, fromAddress, smtp]
