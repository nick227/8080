openapi: 3.1.0
info:
  title: Voice Chat API
  version: 0.1.0
  description: |
    Branching voice/text conversations in public and private rooms.

    Identity is guest-first: clients call `POST /auth/guest` on first visit to get a
    session cookie, and may later upgrade that same account with `POST /auth/register`.

    The server stores conversation facts only (`parentId`); branches are derived
    client-side. Deleting a capture removes its text, media, and stored file
    everywhere it was shared. The placement stays as a tombstone (`deletedAt` set)
    so replies keep their parent.
  license:
    name: UNLICENSED
    identifier: UNLICENSED

servers:
  - url: http://localhost:3001
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Guest sessions, account upgrade, login
  - name: users
    description: Current user profile
  - name: rooms
    description: Conversation rooms and membership
  - name: items
    description: Placements of messages within a room (send, reply, list, delete)
  - name: messages
    description: Reusable message content (share to other rooms)
  - name: reactions
    description: Per-user reactions on items
  - name: media
    description: File and recording uploads
  - name: stream
    description: Real-time room events (SSE)
  - name: workspaces
    description: Workspaces, members, invites, teams, activity and audit (doc/09)
  - name: agents
    description: Communication agents and their email senders (docs/agents)

paths:
  # ─── auth ──────────────────────────────────────────────────────────────────
  /auth/guest:
    post:
      operationId: createGuestSession
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Start a guest session
      description: Creates a guest user and sets the session cookie. Idempotent for a client that already holds a valid session — returns the existing user.
      security: []
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestInput' }
      responses:
        '201':
          description: Guest created — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '200':
          description: Existing session reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register:
    post:
      operationId: register
      x-fastify-config:
        rateLimit: { max: 10, timeWindow: '1 hour' }
      summary: Register, upgrading the current guest if a session is present
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Registered — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      operationId: login
      x-fastify-config:
        rateLimit: { max: 10, timeWindow: '15 minutes' }
      summary: Log in with email and password
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        '200':
          description: Logged out — clears session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/google/url:
    get:
      operationId: getGoogleLoginUrl
      summary: Get Google OAuth Login URL
      security: []
      tags: [auth]
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Google Auth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string }

  /auth/google/callback:
    get:
      operationId: handleGoogleLoginCallback
      summary: Google OAuth Login Callback
      security: []
      tags: [auth]
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirects to frontend

  /integrations/google/callback:
    get:
      operationId: handleGoogleGmailCallback
      summary: Google OAuth Gmail Callback
      security: []
      tags: [agents]
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirects to workspace settings


  # ─── users ─────────────────────────────────────────────────────────────────
  /users/me:
    patch:
      operationId: updateCurrentUser
      summary: Update the current user
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/mutes:
    get:
      operationId: listMutes
      summary: People (and bots) I have muted — personal and global (doc/08 I5)
      tags: [users]
      responses:
        '200':
          description: Muted users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/mutes/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: muteUser
      summary: Mute someone everywhere. Their items reach you content-less; others are unaffected. Idempotent.
      tags: [users]
      responses:
        '200':
          description: Muted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unmuteUser
      summary: Unmute. Idempotent.
      tags: [users]
      responses:
        '200':
          description: Unmuted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Replace the current user's avatar
      description: |
        Signed-in accounts only. Stores the image and points the profile at it.
        The previous avatar file is deleted. Guests receive 403. JPEG, PNG, GIF, or WebP.
      tags: [users]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadAvatarInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ─── rooms ─────────────────────────────────────────────────────────────────
  /rooms:
    get:
      operationId: listRooms
      summary: Browse public rooms, most recently active first
      tags: [rooms]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQuery'
        - in: query
          name: topic
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: Paginated public rooms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRoom
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Create a room; the caller becomes its owner
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomInput' }
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /rooms/mine:
    get:
      operationId: listMyRooms
      summary: Rooms the caller is a member of (public and private), most recently active first
      tags: [rooms]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated rooms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoom
      summary: Get a room
      description: Private rooms return 404 to non-members.
      tags: [rooms]
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRoom
      summary: Update a room (owner only)
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoomInput' }
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRoom
      summary: Delete a conversation (owner only)
      tags: [rooms]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/join:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      operationId: joinRoom
      summary: Join a room. Private rooms require a valid inviteCode. Idempotent.
      tags: [rooms]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRoomInput' }
      responses:
        '200':
          description: Joined (or already a member)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/bots:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomBots
      summary: Every available bot and whether it is seated in this room
      tags: [rooms]
      responses:
        '200':
          description: Bots with their seat in this room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBotList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/bots/{userId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: seatRoomBot
      summary: Add (seat) a bot in this room — owner only. Idempotent.
      tags: [rooms]
      responses:
        '200':
          description: Seated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: kickRoomBot
      summary: Remove (kick) a bot from this room — owner only; it stops at once. Its past items stay. Idempotent.
      tags: [rooms]
      responses:
        '200':
          description: Kicked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/participants:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomParticipants
      summary: Who is in this conversation — members and seated bots, with live presence
      description: |
        One roster for people and bots alike, so the client renders every participant
        the same way (doc/08 §2.3). `present` comes from deduplicated room presence;
        seated bots are always present. Private rooms return 404 to non-members.
      tags: [rooms]
      responses:
        '200':
          description: Participants, present first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/members/me:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    delete:
      operationId: leaveRoom
      summary: Leave a room. Owners cannot leave their own room.
      tags: [rooms]
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/invite-code:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      operationId: rotateInviteCode
      summary: Issue a new invite code for a private room (owner only); the old code stops working
      tags: [rooms]
      responses:
        '200':
          description: Room with new inviteCode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/live-token:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getLiveToken
      x-fastify-config:
        rateLimit: { max: 120, timeWindow: '1 hour' }
      summary: A short-lived token to join this room's live video (LiveKit)
      description: |
        Room access decides: callers who can't view the room get 404, like every room read.
        The token is for this room only, expires in 10 minutes (a connected client is
        refreshed by LiveKit), may always subscribe, and may publish camera and screen share
        for people (not bots or suspended accounts). Async recordings never go through live.
        503 LIVE_UNAVAILABLE when live video isn't configured on the server.
      tags: [rooms]
      responses:
        '200':
          description: Token and the LiveKit server to use it with
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Live video is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── items ─────────────────────────────────────────────────────────────────
  /rooms/{roomId}/items:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomItems
      summary: Items in a room, ordered by number
      description: |
        Flat list; build branches client-side from `parentId`.
        Pass `after` (an item number) to fetch only items newer than one you already have —
        recovers newly created items only, not updates or deletions.
        Use `order=desc` for the newest window, then follow nextCursor for older pages.
      tags: [items]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
          description: Number ordering; desc starts with the newest items and pages backward.
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
          description: Only return items with number greater than this.
      responses:
        '200':
          description: Paginated items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedItems' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendMessage
      x-fastify-config:
        rateLimit: { max: 60, timeWindow: '1 minute' }
      summary: Send a new message to a room (top-level)
      description: |
        Requires membership (public rooms auto-join on first post). Must include text or
        at least one media id (400 `EMPTY_ITEM`). `mediaIds` must be uploads owned by the
        caller and not yet attached. Creates a new Message and an Item in the room.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageInput' }
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /items/{itemId}/replies:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: replyToItem
      x-fastify-config:
        rateLimit: { max: 60, timeWindow: '1 minute' }
      summary: Reply to an item
      description: |
        Creates a new Message and a child Item **in the parent's room** — the room is
        always taken from the parent, so a reply can never be placed in another room.
        404 if the parent isn't visible to the caller. Same content rules as sendMessage.
        Optional `anchorStartMs` attaches the reply to a **moment** (a point, not a
        segment) in the parent's audio/video. Allowed only when the parent has exactly one
        visible audio/video attachment with a known duration (else 400 `ANCHOR_UNSUPPORTED`),
        and must be ≤ that duration (else 400 `INVALID_ANCHOR`). Anchors live on this room's
        Item, so sharing the parent elsewhere carries none of them.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplyToItemInput' }
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/share:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    post:
      operationId: shareMessageToRooms
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 minute' }
      summary: Share an existing message to other rooms
      description: |
        Creates one top-level Item per target room that reuses the same Message and media —
        no content or upload is duplicated. Rooms where the message already has a live
        Item are skipped (idempotent); the response lists only newly created Items.
        Only the message's author may share it (403), so private-room content can't be
        re-published by others. All target rooms must be postable by the caller — public
        rooms auto-join, private rooms require membership (404 otherwise). All-or-nothing.
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareMessageInput' }
      responses:
        '201':
          description: Items created by this share (empty if every room already had it)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: getItem
      summary: Get an item
      tags: [items]
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteItem
      summary: Permanently delete a capture (author only). The placement stays so replies keep their parent.
      tags: [items]
      responses:
        '200':
          description: Tombstoned item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── reactions ─────────────────────────────────────────────────────────────
  /items/{itemId}/choice:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: chooseOption
      x-fastify-config:
        rateLimit: { max: 60, timeWindow: '1 minute' }
      summary: Answer a bot message's choice (first choice wins; repeating it is a no-op)
      description: |
        Records the caller's answer on the message and lets the flow that asked advance
        deterministically (the bot's follow-up arrives as a new item). The click is never
        sent to a model. 400 NOT_A_CHOICE / INVALID_CHOICE, 403 NOT_YOUR_CHOICE,
        409 CHOICE_CLOSED (already answered differently, or the item was deleted).
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChooseInput' }
      responses:
        '200':
          description: The answered item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /items/{itemId}/reactions/{type}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/ReactionTypeParam'
    put:
      operationId: addReaction
      summary: Add the caller's reaction (idempotent)
      tags: [reactions]
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeReaction
      summary: Remove the caller's reaction (idempotent)
      tags: [reactions]
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── media ─────────────────────────────────────────────────────────────────
  /media:
    post:
      operationId: uploadMedia
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 minute' }
      summary: Upload a recording or file; attach it by id in createItem
      tags: [media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadMediaInput' }
      responses:
        '201':
          description: Uploaded (not yet attached to an item)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /media/youtube:
    post:
      operationId: createYouTubeMedia
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 minute' }
      summary: Register a YouTube video as media (nothing is downloaded)
      description: |
        Resolves the link to a canonical video id, verifies the video exists (oEmbed) and stores
        its title — never the media itself. Attach the returned id via mediaIds like any upload.
        400 `INVALID_YOUTUBE_URL` for non-video links (incl. playlist-only),
        400 `YOUTUBE_UNAVAILABLE` for missing/private videos.
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateYouTubeMediaInput' }
      responses:
        '201':
          description: Registered (not yet attached to an item)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: YouTube lookup failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    delete:
      operationId: deleteMedia
      summary: Delete an upload that was never used (owner only)
      description: |
        For abandoned drafts. Only the owner's media that is attached to no message and is
        no room's thumbnail; the stored file goes too. 409 `MEDIA_IN_USE` otherwise.
      tags: [media]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Attached to a message or used as a thumbnail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /media/{mediaId}/playback:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      operationId: playbackMedia
      summary: Get playback URL for media
      description: |
        Returns a 307 redirect to the stored file. Authorized by a session that may see the
        media, or by `token` — the short-lived signed token in the `url` the API returns for
        the media (media elements with crossOrigin="anonymous" send no cookies).
      tags: [media]
      # Session optional: an anonymous request needs a valid token (checked in the handler).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: token
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        '307':
          description: Redirect to S3
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── stream ────────────────────────────────────────────────────────────────
  /rooms/{roomId}/stream:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      parameters:
        - in: query
          name: cursor
          schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        - in: header
          name: Last-Event-ID
          schema: { type: string }
      operationId: streamRoomEvents
      summary: Server-Sent Events for a room
      description: |
        `text/event-stream`. Each message's `event:` field is the StreamEvent `type`
        and `data:` is a hydrated StreamEvent. Every item change has a durable room
        sequence in `id:`. Resume with Last-Event-ID or the cursor query parameter
        from listRoomItems meta.changeCursor. Replay uses bounded batches of current
        item state, including tombstones and viewer-specific reactions.
        A `ping` comment is sent every 25s to keep proxies from closing the connection.
      tags: [stream]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each data payload is a JSON StreamEvent
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── workspaces (doc/09) ───────────────────────────────────────────────────
  /workspaces:
    get:
      operationId: listMyWorkspaces
      summary: Workspaces the caller is an active member of
      tags: [workspaces]
      responses:
        '200':
          description: Workspaces with the caller's role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createWorkspace
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Create a workspace; the caller becomes its owner
      description: Requires a registered account (403 REGISTRATION_REQUIRED for guests). A slug is derived from the name when omitted.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceInput' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: Get a workspace
      description: Non-members get 404.
      tags: [workspaces]
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWorkspace
      summary: Update a workspace (owner/admin)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceInput' }
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace (owner only; soft delete)
      tags: [workspaces]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceMembers
      summary: Members of a workspace
      tags: [workspaces]
      parameters:
        - in: query
          name: includeRemoved
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Members, earliest joined first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      operationId: updateWorkspaceMember
      summary: Update a member
      description: |
        Anyone may edit their own title and timezone. Role and status need owner/admin;
        only owners change owners or grant ownership. A workspace keeps at least one
        active owner (409 LAST_OWNER).
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceMemberInput' }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeWorkspaceMember
      summary: Remove a member, or leave (when it is the caller)
      description: The member row is kept with status `removed`; team memberships end.
      tags: [workspaces]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/invites:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceInvites
      summary: Pending invites (owner/admin)
      tags: [workspaces]
      responses:
        '200':
          description: Pending, unexpired invites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceInviteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createWorkspaceInvite
      x-fastify-config:
        rateLimit: { max: 50, timeWindow: '1 hour' }
      summary: Invite someone by email (owner/admin)
      description: |
        Returns the invite token once; deliver the link yourself (no email is sent yet).
        A new invite for the same email replaces the pending one. Expires in 7 days.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceInviteInput' }
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedWorkspaceInviteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: inviteId
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    delete:
      operationId: revokeWorkspaceInvite
      summary: Revoke a pending invite (owner/admin)
      tags: [workspaces]
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace-invites/accept:
    post:
      operationId: acceptWorkspaceInvite
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 hour' }
      summary: Accept an invite and join its workspace
      description: |
        The caller must be a registered account whose email matches the invite
        (403 REGISTRATION_REQUIRED / INVITE_EMAIL_MISMATCH). Invalid, used, revoked or
        expired tokens get 404 INVITE_INVALID. A removed member is re-activated.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptWorkspaceInviteInput' }
      responses:
        '200':
          description: The joined workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/teams:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listTeams
      summary: Teams in a workspace
      tags: [workspaces]
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Teams by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTeam
      summary: Create a team (owner/admin)
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamInput' }
      responses:
        '201':
          description: Team created (or the earlier result, for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
    patch:
      operationId: updateTeam
      summary: Rename, describe, archive or restore a team (owner/admin)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamInput' }
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/teams/{teamId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/MemberId'
    put:
      operationId: setTeamMember
      summary: Add a member to a team, or change their team role (owner/admin or team lead)
      tags: [workspaces]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTeamMemberInput' }
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeTeamMember
      summary: Remove a member from a team (owner/admin, team lead, or the member themselves)
      tags: [workspaces]
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/proposals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listProposals
      summary: Proposals on a record (doc/13 §5), newest first
      tags: [proposals]
      parameters:
        - { in: query, name: targetType, schema: { type: string, maxLength: 32 } }
        - { in: query, name: targetId, schema: { type: string, maxLength: 64 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, applied, dismissed, expired, undone] } }
      responses:
        '200':
          description: Up to 50, each with its status brought up to date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProposal
      summary: Propose a typed change to one record; posts it as a card in the workspace channel
      description: |
        `kind` selects a registered server-side handler that validates `change`, checks
        permissions and the record's version. Proposing needs read access; applying is
        the kind's own rule (e.g. owners/admins for the company profile).
      tags: [proposals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProposalInput' }
      responses:
        '201':
          description: The pending proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/crm/notes:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: addCrmNote
      summary: Turn a messy business note into one proposed CRM change (doc/13 §10)
      description: |
        Start with `text`. The note is read (grounded in its own words), matched against
        contacts and accounts, and planned. Results: `proposed` (a crm.note proposal, its
        card posted in the channel), `ambiguous` (send `draftId` with `contactId` or
        `accountId` — an id, `new`, or for the company `none`), or `needs-person`
        (send `draftId` with `about`: who it is about).
      tags: [proposals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCrmNoteInput' }
      responses:
        '200':
          description: A choice is needed first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmNoteResultResponse' }
        '201':
          description: Proposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmNoteResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    put:
      operationId: editProposal
      summary: Edit a pending proposal before Apply (kinds that allow it); re-validated by its handler
      tags: [proposals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditProposalInput' }
      responses:
        '200':
          description: The edited proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: getProposal
      summary: One proposal, status brought up to date
      tags: [proposals]
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/proposals/{proposalId}/apply:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: applyProposal
      summary: Apply it (idempotent); 409 PROPOSAL_EXPIRED if the record changed since
      tags: [proposals]
      responses:
        '200':
          description: The applied proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/proposals/{proposalId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: dismissProposal
      summary: Not now
      tags: [proposals]
      responses:
        '200':
          description: The dismissed proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/proposals/{proposalId}/undo:
