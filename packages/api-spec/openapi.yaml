    BriefEvidence:
      type: object
      required: [id, kind, when, title, text, link]
      properties:
        id: { type: string, description: 'e.g. note:<id>, message:<id>' }
        kind: { type: string, enum: [contact, account, note, activity, message, document] }
        when: { type: [string, 'null'] }
        title: { type: string }
        text: { type: string }
        link:
          description: Where it opens in the app, if anywhere
          oneOf:
            - type: 'null'
            - type: object
              required: [type]
              properties:
                type: { type: string, enum: [room, account, document] }
                roomId: { type: string }
                id: { type: string }

    ContactBrief:
      type: object
      required: [summary, need, recent, commitments, openQuestions, nextStep, generatedAt, generator, model, stale, evidence]
      properties:
        summary: { type: array, items: { $ref: '#/components/schemas/BriefClaim' } }
        need: { type: array, items: { $ref: '#/components/schemas/BriefClaim' } }
        recent: { type: array, items: { $ref: '#/components/schemas/BriefClaim' } }
        commitments: { type: array, items: { $ref: '#/components/schemas/BriefClaim' } }
        openQuestions: { type: array, items: { $ref: '#/components/schemas/BriefClaim' } }
        nextStep:
          description: A suggestion (inference), with the evidence it is based on
          oneOf:
            - type: 'null'
            - type: object
              required: [text, basis]
