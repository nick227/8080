      required: [contacted, qualified, proposalSent, won, nextAction, interestedIn, lastContactedAt, priority, waitingOn, potentialValue, fieldValues, version, id, workspaceId, firstName, lastName, displayName, title, status, ownerMemberId, teamId, leadStatus, leadSource, nextFollowUp, primaryEmail, primaryPhone, imageUrl, lastActivityAt, origin, externalProvider, externalId, createdAt, updatedAt, points, accounts, tags]
      properties:
        contacted: { type: boolean }
        qualified: { type: boolean }
        proposalSent: { type: boolean }
        won: { type: boolean }
        nextAction: { type: [string, 'null'], maxLength: 255 }
        interestedIn: { type: [string, 'null'], maxLength: 255 }
        lastContactedAt: { type: [string, 'null'], format: date-time }
        priority: { type: string, maxLength: 40 }
        waitingOn: { type: [string, 'null'], maxLength: 40 }
        potentialValue: { type: [number, 'null'], minimum: 0, maximum: 9999999999999.99 }
        fieldValues:
          type: object
          maxProperties: 100
          additionalProperties:
            type: [string, number, boolean, 'null']
        version: { type: integer, minimum: 1 }
        id: { type: string }
        workspaceId: { type: string }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        displayName: { type: string }
        title: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RecordStatus' }
        ownerMemberId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        leadStatus:
          oneOf:
            - $ref: '#/components/schemas/LeadStatus'
            - type: 'null'
        leadSource: { type: [string, 'null'] }
        nextFollowUp: { type: [string, 'null'], format: date-time }
        primaryEmail: { type: [string, 'null'] }
        primaryPhone: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'], description: Denormalized primary gallery projection }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        origin: { $ref: '#/components/schemas/RecordOrigin' }
        externalProvider: { type: [string, 'null'] }
        externalId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/ContactPoint' }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/ContactAccountLink' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    ContactRef:
      type: object
