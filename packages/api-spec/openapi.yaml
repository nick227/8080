        accounts: { type: array, items: { $ref: '#/components/schemas/CrmNoteCandidate' } }

    CrmNoteResultResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CrmNoteResult' }

    CreateProposalInput:
