    patch:
      operationId: setCompanyImagePrimary
      summary: Set the primary company gallery image
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordImageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/company-profile/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RecordImageId'
    delete:
      operationId: deleteCompanyImage
      summary: Remove a company gallery image
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/insights:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspaceInsights
      summary: Company desk aggregates (deterministic counts and deep links)
      tags: [workspaces]
      responses:
        '200':
          description: Insight cards, attention rows, pipeline snapshot, recent activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceInsightsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/vocabulary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspaceVocabulary
      summary: Pipeline stages and inventory categories
      tags: [workspaces]
      responses:
        '200':
          description: Vocabulary for the Company desk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceVocabularyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/pipeline:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      operationId: updateWorkspacePipeline
      summary: Replace the workspace sales pipeline (labels, order, add, archive)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePipelineInput' }
      responses:
        '200':
          description: Active stages after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineStagesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/vocabulary/categories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createInventoryCategory
      summary: Add an inventory category to the workspace vocabulary
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                      name: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      operationId: renameInventoryCategory
      summary: Rename an inventory category across items (empty to clears it)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              additionalProperties: false
              properties:
                from: { type: string, minLength: 1, maxLength: 80 }
                to: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Rename applied
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [from, to]
                    additionalProperties: false
                    properties:
                      from: { type: string }
                      to: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteInventoryCategory
      summary: Remove an inventory category and clear it from items
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Category removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [from, to]
                    additionalProperties: false
                    properties:
                      from: { type: string }
                      to: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/vocabulary/fields:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      operationId: updateContactFieldLabels
      summary: Update contact field labels shown in the workbench
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactFieldLabelsInput' }
      responses:
        '200':
          description: Field definitions after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactFieldDefinitionsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── agents: email senders (docs/agents/07) ───────────────────────────────
  /workspaces/{workspaceId}/email-connections:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listEmailConnections
      summary: The workspace's email senders
      description: |
        Always includes "Send with 8080" (mode `platform`), which every workspace has from
        creation. Own senders (mode `own`) arrive later; their strategy (SMTP, Google,
        Microsoft, Resend domain) is how they connect, not a separate kind of sender.
      tags: [agents]
      responses:
        '200':
          description: Senders, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConnectionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createEmailConnection
      summary: Add an own sender — "Use my own email/domain" (owners/admins)
      description: |
        SMTP for now (a mailbox and its app password). The password is stored encrypted and
        never returned. Not the default unless `makeDefault`. Run the test afterwards.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmailConnectionInput' }
      responses:
        '201':
          description: The new sender
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConnectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/email-connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/EmailConnectionId'
    patch:
      operationId: updateEmailConnection
      summary: Change a sender's name, reply-to, own-mailbox details, or make it the default (owners/admins)
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmailConnectionInput' }
      responses:
        '200':
          description: The sender after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConnectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteEmailConnection
      summary: Remove an own sender; agents that used it fall back to the default (owners/admins)
      tags: [agents]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteEmailConnectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/email-connections/{connectionId}/test:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/EmailConnectionId'
    post:
      operationId: testEmailConnection
      summary: Check a sender and email a short test to the caller (owners/admins)
      description: A failed check is a 200 with `ok` false and the reason; it is also kept on the sender as `lastError`.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  description: Optional target email recipient address for test email dispatch.
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConnectionTestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── agents (docs/agents; roadmap S1) ──────────────────────────────────────
  /workspaces/{workspaceId}/agent-business-events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: recordAgentBusinessEvent
      summary: Record an outreach, reply, or completed job
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contactId, kind, sourceKey, occurredAt]
              properties:
                contactId: { type: string, minLength: 1, maxLength: 64 }
                kind: { type: string, enum: [outreach_sent, reply_received, job_completed] }
                sourceKey: { type: string, minLength: 1, maxLength: 100 }
                occurredAt: { type: string, format: date-time }
                jobId: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Recorded once; retries with the same source key return the original event
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, kind, contactId, occurredAt]
                    properties:
                      id: { type: string }
                      kind: { type: string }
                      contactId: { type: string }
                      occurredAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /workspaces/{workspaceId}/agent-suppressions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listAgentSuppressions
      summary: List customer email exclusions
      tags: [workspaces]
      responses:
        '200':
          description: Current exclusions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AgentSuppression' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAgentSuppression
      summary: Exclude an email address from customer Agents
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, reason]
              properties:
                address: { type: string, format: email, maxLength: 254 }
                reason: { type: string, enum: [manual, bounce, complaint] }
      responses:
        '201':
          description: Excluded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AgentSuppression' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent-unsubscribe/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    get:
      operationId: agentUnsubscribePage
      summary: Confirm an email unsubscribe request without changing preferences
      tags: [workspaces]
      security: []
      responses:
        '200':
          description: Confirmation page
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: agentUnsubscribe
      summary: Stop customer emails using a message unsubscribe token
      tags: [workspaces]
      security: []
      x-fastify-config:
        rateLimit: { max: 60, timeWindow: '1 minute' }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Unsubscribed (idempotent)
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workspaces/{workspaceId}/agent-audience/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: previewAgentAudience
      summary: Preview a deterministic contact audience
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipientConfig' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Current audience, resolved without sending
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [matchedCount, recipientCount, contacts]
                    properties:
                      matchedCount: { type: integer }
                      recipientCount: { type: integer }
                      contacts:
                        type: array
                        items:
                          type: object
                          required: [id, name, email]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            email: { type: [string, 'null'] }

  /workspaces/{workspaceId}/agent-types:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listAgentTypes
      summary: The built-in agents that can be added
      tags: [agents]
      responses:
        '200':
          description: Available types
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTypeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agents:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listAgents
      summary: Active, paused and draft agents
      tags: [agents]
      responses:
        '200':
          description: Agents, active first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAgent
      summary: Add a built-in agent — creates a draft straight away (owners/admins)
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentInput' }
      responses:
        '201':
          description: The new draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getAgent
      summary: One agent with its sender, recipients and next/last event
      tags: [agents]
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAgent
      summary: Change name, template, theme, destinations, time or sections (owners/admins)
      description: Edits affect future events only. An active agent's upcoming event follows a new time.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAgentInput' }
      responses:
        '200':
          description: The agent after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteAgent
      summary: Delete a draft with no history, else archive it (owners/admins)
      tags: [agents]
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteAgentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agents/{agentId}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: publishAgent
      summary: Start (or resume) the agent; schedules its next event (owners/admins)
      tags: [agents]
      responses:
        '200':
          description: The active agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/agents/{agentId}/pause:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: pauseAgent
      summary: Pause an active agent; its upcoming event is removed (owners/admins)
      tags: [agents]
      responses:
        '200':
          description: The paused agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/agents/{agentId}/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: previewAgent
      summary: The report as it would go out now, rendered for the caller (no side effects)
      tags: [agents]
      responses:
        '200':
          description: Rendered email, chat post and section counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agents/{agentId}/test:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    post:
      operationId: sendAgentTest
      summary: Email the current report to the caller only, marked as a test (owners/admins)
      description: No event is created and nothing is posted to company chat. A failed send is a 200 with `ok` false.
      tags: [agents]
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agent-events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listAgentEvents
      summary: The activity river — upcoming and past agent events, latest scheduled time first
      tags: [agents]
      parameters:
        - in: query
          name: agentId
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEventListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agent-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentEventId'
    get:
      operationId: getAgentEvent
      summary: The frozen facts of one event — per-destination results, failures and attempts
      tags: [agents]
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEventDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agent-events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentEventId'
    post:
      operationId: cancelAgentEvent
      summary: Cancel an upcoming or running event; the schedule moves on (owners/admins)
      tags: [agents]
      responses:
        '200':
          description: The canceled event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEventDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/activity:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceActivity
      summary: The workspace timeline, newest first
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/actions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceActions
      summary: Audit log of every action, newest first (owner/admin)
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: targetType
          schema: { type: string, minLength: 1, maxLength: 32 }
        - in: query
          name: targetId
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Paginated action executions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedActionExecutions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── inbox attention queue and composer (doc/11) ───────────────────────────
  /workspaces/{workspaceId}/inbox:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listInboxItems
      summary: The caller's attention queue, newest first
      description: Archived rows are hidden unless `archived=true`. A member sees only their own items.
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: archived
          schema: { type: boolean, default: false }
        - in: query
          name: unread
          schema: { type: boolean }
        - in: query
          name: starred
          schema: { type: boolean }
        - in: query
          name: sourceType
          description: Only items about this kind of source (e.g. task)
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedInboxItems' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/inbox/{inboxItemId}/read:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: inboxItemId
        required: true
        schema: { type: string }
    patch:
      operationId: readInboxItem
      summary: Mark the caller's item read or unread
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadInboxItemInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/inbox/{inboxItemId}/star:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: inboxItemId
        required: true
        schema: { type: string }
    patch:
      operationId: starInboxItem
      summary: Star or unstar the caller's item
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StarInboxItemInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/inbox/{inboxItemId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: inboxItemId
        required: true
        schema: { type: string }
    patch:
      operationId: archiveInboxItem
      summary: Archive or restore the caller's item
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveInboxItemInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/inbox/stream:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: streamInbox
      summary: Server-Sent Events for the caller's inbox
      description: |
        `text/event-stream`. `inbox.created` carries the item that just became visible
        to this member, including a timed item whose `deliverAt` has arrived.
        A `ping` comment keeps proxies from closing the connection.
      tags: [workspaces]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each data payload is a JSON InboxStreamEvent
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/compose:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: sendCompose
      summary: Record a follow-up to a contact
      description: Email is the only channel. This stores the follow-up and a contact activity. It does not deliver mail and it does not create an inbox item.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendComposeInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComposeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── contacts, accounts, tags, notes, links (doc/09 slice 1) ───────────────
  /workspaces/{workspaceId}/contacts/fields:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listContactFields
      summary: Contact field definitions for this workspace
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContactFieldDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /workspaces/{workspaceId}/contacts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listContacts
      summary: Contacts, by name
      description: |
        `q` matches name, company, contact details, or interests (contains). `accountId`: people currently at that account. Defaults to active contacts.
      tags: [workspaces]
      parameters:
        - in: query
          name: audience
          schema: { type: string, maxLength: 50000 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: ownerMemberId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: tagId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: accountId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/RecordStatus' }
        - in: query
          name: leadStatus
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - in: query
          name: focus
          description: Working view over active contacts (due = follow-up today; overdue excludes customer/lost)
          schema: { type: string, enum: [due, overdue, unassigned, neverContacted, waitingOnUs, needsProposal] }
        - in: query
          name: sort
          schema: { type: string, enum: [name, company, owner, stage, followUp, lastContacted, interestedIn, contacted, qualified, proposalSent, won, potentialValue, priority, updated, activity], default: name }
        - in: query
          name: dir
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: query
          name: thenSort
          schema: { type: string, enum: [name, company, owner, stage, followUp, lastContacted, interestedIn, contacted, qualified, proposalSent, won, potentialValue, priority, updated, activity] }
        - in: query
          name: thenDir
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: milestone
          schema: { type: string, enum: [contacted, qualified, proposalSent, won] }
        - in: query
          name: checked
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedContacts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createContact
      summary: Create a contact
      description: |
        Never refuses a likely duplicate (doc/09 D2): `duplicates` lists live contacts with the same personal email,
        or the same name at the same account. Role addresses (info@…) are stored as shared unless `shared: false`.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/counts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: countContacts
      summary: Working-view counts for contacts
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCountsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/bulk:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: bulkUpdateContacts
      summary: Update selected contacts
      description: Explicit selected ids only (at most 50). Does not imply every matching record.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkContactsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/match:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: matchContact
      summary: What the matcher concludes for an email
      description: |
        `match`: exactly one live contact holds it as a personal address; `ambiguous`: several do; `shared`: only as a
        shared/role address (never auto-matched); `none`. `account` applies the same rule to the email's domain.
      tags: [workspaces]
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/{contactId}/brief:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: getContactBrief
      summary: The viewer's last brief on this contact, and whether it is stale (doc/13 D3)
      description: Read-only. null until the viewer asks for one. `stale` is true when the evidence it was built from has changed since.
      tags: [contacts]
      responses:
        '200':
          description: The brief, or null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactBriefResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: generateContactBrief
      summary: Brief me — build a fresh brief from the evidence the viewer can see
      description: |
        Read-only: changes no record. Every factual item cites evidence from the pack
        (the contact, its companies, notes, timeline, linked conversations and their
        documents); the suggested next step is labelled inference. AI off → a
        deterministic brief from the records.
      tags: [contacts]
      responses:
        '200':
          description: The new brief
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactBriefResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/sheets/presets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listSheetPresets
      summary: The common sheets, one button each (doc/13 §12, A1)
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetPresetList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/sheets/describe:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: describeSheet
      summary: A sheet query in plain words, checked but not run
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DescribeSheetInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/sheets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createSheet
      summary: Make a spreadsheet from Contacts or Inventory
      description: |
        A preset or a whitelisted sheet query → a native grid whose rows are stored on
        the server. Rows, counts and totals are computed by code. The document's
        provenance is the recipe (resolved query, as-of time, data hash), so the data
        can be checked for changes and the sheet made again. Private to its maker.
        Retry-safe by idempotencyKey. More than 5000 rows → 400 SHEET_TOO_LARGE.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSheetInput' }
      responses:
        '201':
          description: The new document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
