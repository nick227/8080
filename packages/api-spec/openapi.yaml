                text: { type: string }
                basis: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
        generator: { type: string, enum: [ai, template] }
        model: { type: [string, 'null'] }
        stale: { type: boolean, description: The evidence changed since this brief was made }
        evidence: { type: array, items: { $ref: '#/components/schemas/BriefEvidence' }, description: The evidence it cites }

    ContactBriefResponse:
