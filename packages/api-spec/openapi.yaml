        data: { $ref: '#/components/schemas/TaskReport' }
    TaskReport:
      type: object
      required: [range, filtered, now, done, throughput, cycleTime, flow, hours, people]
      properties:
        filtered:
          type: boolean
          description: True when the board filters narrowed the tasks counted.
        range:
          type: object
          required: [from, to, weeks, timezone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            weeks: { type: integer }
            timezone: { type: string }
        now:
          type: object
          required: [todo, doing, overdue, dueWeek, blocked]
          properties:
            todo: { type: integer }
            doing: { type: integer }
            overdue: { type: integer }
            dueWeek: { type: integer }
            blocked: { type: integer }
        done:
          type: object
          required: [thisPeriod, previousPeriod]
          properties:
            thisPeriod: { type: integer }
            previousPeriod: { type: integer }
        throughput:
          type: array
          items:
            type: object
            required: [weekStart, done]
            properties:
              weekStart: { type: string, format: date }
              done: { type: integer }
        cycleTime:
          type: object
          required: [medianHours, p85Hours, samples, weekly]
          properties:
            medianHours: { type: [number, 'null'] }
            p85Hours: { type: [number, 'null'] }
            samples: { type: integer }
            weekly:
              type: array
              items:
                type: object
                required: [weekStart, medianHours, p85Hours, samples]
                properties:
                  weekStart: { type: string, format: date }
                  medianHours: { type: [number, 'null'] }
                  p85Hours: { type: [number, 'null'] }
                  samples: { type: integer }
        flow:
          type: array
          items:
            type: object
            required: [day, todo, doing, done]
            properties:
              day: { type: string, format: date }
              todo: { type: integer }
              doing: { type: integer }
              done: { type: integer }
        hours:
          type: object
          description: Hours logged with Log work in the range, by week and by the person credited (null = whole team).
          required: [total, entries, weekly, people]
          properties:
            total: { type: number }
            entries: { type: integer }
            weekly:
              type: array
              items:
                type: object
                required: [weekStart, hours]
                properties:
                  weekStart: { type: string, format: date }
                  hours: { type: number }
            people:
              type: array
              items:
                type: object
                required: [memberId, name, hours]
                properties:
                  memberId: { type: [string, 'null'] }
                  name: { type: string }
                  hours: { type: number }
        people:
          type: array
          items:
            type: object
            required: [memberId, name, todo, doing, blocked, overdue]
            properties:
              memberId: { type: [string, 'null'] }
              name: { type: string }
              todo: { type: integer }
              doing: { type: integer }
              blocked: { type: integer }
              overdue: { type: integer }
