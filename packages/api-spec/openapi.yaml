        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createInventoryImport
      summary: Preview importing a table as inventory
      description: |
        SKU matches an existing item uniquely; duplicate SKUs in the file are flagged.
        Matched rows skip by default, or update mapped non-empty fields when `options.onMatch` is `update`.
        Blank cells leave existing values unchanged. Nothing is written until commit.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInventoryImportInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/inventory-imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: getInventoryImport
      summary: Get an inventory import
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateInventoryImport
      summary: Remap columns or change match behaviour and re-preview
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInventoryImportInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelInventoryImport
      summary: Cancel a previewed inventory import
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/inventory-imports/{importId}/rows:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: listInventoryImportRows
      summary: Paginated preview / outcome rows
      tags: [workspaces]
      parameters:
        - name: proposal
          in: query
          schema: { $ref: '#/components/schemas/ImportProposal' }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/ImportOutcome' }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedInventoryImportRows' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/inventory-imports/{importId}/rows/{rowId}/resolution:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
      - $ref: '#/components/parameters/ImportRowId'
    put:
      operationId: resolveInventoryImportRow
      summary: Decide create / use existing / skip for one row
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveInventoryImportRowInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/inventory-imports/{importId}/commit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    post:
      operationId: commitInventoryImport
      summary: Apply the reviewed inventory import
      description: |
        Creates new items, matches or updates by SKU per options, skips the rest.
        Idempotent and resumable like contact import.
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─── shared native content (doc/10 §10 POC: block documents) ───────────────
  /workspaces/{workspaceId}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocumentContent
      summary: The shared content of a block document
      description: Version 0 with null content means nothing has been saved yet. Block documents only (400 NOT_SHARED_CONTENT otherwise).
      tags: [documents]
      responses:
        '200':
          description: Current content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveDocumentContent
      x-fastify-config:
        rateLimit: { max: 600, timeWindow: '1 minute' }
      summary: Save the content, based on a version (editors)
      description: |
        Optimistic: `expectedVersion` is the version the edit was based on (0 for the first
        save). If someone saved since, 409 DOCUMENT_CONTENT_CONFLICT — fetch the latest,
        reapply your changes and retry; nothing is overwritten silently. Open streams get
        `document.updated` at once.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDocumentContentInput' }
      responses:
        '200':
          description: Saved content (new version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/documents/{documentId}/presence:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    put:
      operationId: setDocumentPresence
      x-fastify-config:
        rateLimit: { max: 600, timeWindow: '1 minute' }
      summary: Say whether you are editing (lapses after a few seconds without a renewal)
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentPresenceInput' }
      responses:
        '200':
          description: Noted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/documents/{documentId}/stream:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: streamDocumentEvents
      summary: Server-Sent Events for one shared document
      description: |
        `text/event-stream`. `document.updated` carries the new version (fetch the content);
        `document.presence` lists who has the document open and who is editing. Readers only.
        A `ping` comment keeps proxies from closing the connection. See DocumentStreamEvent.
      tags: [documents]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each data payload is a JSON DocumentStreamEvent
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listTasks
      summary: Every live task in the workspace (Calendar and Boards)
      description: Ordered by status, then board rank. Deleted tasks are left out.
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTask
      summary: Add a task
      description: |
        `status` defaults to open. Place it in its column with `afterTaskId` / `beforeTaskId`
        (the cards above / below); neither puts it at the bottom. A time needs a date.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/stream:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: streamTasks
      summary: Server-Sent Events for live board updates
      description: |
        `text/event-stream`. Frames: `ready` (first; `replayed: false` means fetch the task
        list once to reconcile), `task.changed` (the task's current snapshot with its
        `version`, or `task: null` when deleted), `worklogs.changed`, `board.updated`
        (WIP limits) and `reset` (reconcile). Every frame has an `id`; reconnect with
        Last-Event-ID (the browser does this) or `after` to replay what was missed.
        A `ping` comment keeps proxies from closing the connection.
      tags: [workspaces]
      parameters:
        - in: query
          name: after
          description: The last frame id seen (same as the Last-Event-ID header)
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each data payload is a JSON TaskStreamEvent
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/bulk:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: bulkTasks
      summary: One change to many tasks (update, delete or restore), all or nothing
      description: |
        Up to 200 tasks. `update` applies the same field rules as editing one task (a new
        status lands at the bottom of that column, in board order); `blocked` with a reason
        blocks, `null` unblocks. Every task gets its own history line. A task outside this
        workspace (or deleted, except for restore) fails the whole request with 400
        INVALID_SELECTION. Repeat with the same idempotencyKey to get the first result back.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkTasksInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/tasks/report:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getTaskReport
      summary: Board reports (throughput, cycle time, cumulative flow, open work)
      description: |
        Derived from recorded history and current tasks, in the workspace's time zone
        (weeks start Monday). Done and started follow workflow categories; overdue, due
        this week and blocked use the shared urgency definitions. Cumulative flow counts
        live tasks only.
      tags: [workspaces]
      parameters:
        - in: query
          name: weeks
          schema: { type: integer, minimum: 1, maximum: 26, default: 8 }
        - in: query
          name: who
          description: Comma-separated member ids; `unassigned` = no assignee (current assignee).
          schema: { type: string, maxLength: 2000 }
        - in: query
          name: type
          description: Comma-separated issue types.
          schema: { type: string, maxLength: 500 }
        - in: query
          name: area
          description: Comma-separated areas.
          schema: { type: string, maxLength: 1000 }
        - in: query
          name: priority
          description: Comma-separated priorities.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: q
          description: Title or key contains.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/import:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: importTasks
      summary: Add many tasks at once (CSV import, tasks saved in a browser)
      description: At most 500. Assignees that aren't active members are dropped. Repeat with the same idempotencyKey to get the first result back.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportTasksInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTask
      summary: Get a task
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTask
      summary: Edit a task
      description: With expectedVersion, a newer version gives 409 TASK_VERSION_CONFLICT. A status change lands at the bottom of the new column.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTask
      summary: Delete a task (restore undoes it)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/{taskId}/move:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: moveTask
      summary: Move a card on the board (status and position)
      description: Neighbours must be live cards in the target column, else 400 INVALID_POSITION.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveTaskInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/{taskId}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: restoreTask
      summary: Undo a delete
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/{taskId}/block:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: blockTask
      summary: Mark a task blocked, with what it is waiting on
      description: The flag sits on top of the status. Blocking again changes the reason and keeps the start time.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockTaskInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/{taskId}/unblock:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: unblockTask
      summary: Clear the blocked flag
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tasks/{taskId}/activity:
    parameters:
