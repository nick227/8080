openapi: 3.1.0
info:
  title: Voice Chat API
  version: 0.1.0
  description: |
    Branching voice/text conversations in public and private rooms.

    Identity is guest-first: clients call `POST /auth/guest` on first visit to get a
    session cookie, and may later upgrade that same account with `POST /auth/register`.

    The server stores conversation facts only (`parentId`); branches are derived
    client-side. Deleting a capture removes its text, media, and stored file
    everywhere it was shared. The placement stays as a tombstone (`deletedAt` set)
    so replies keep their parent.
  license:
    name: UNLICENSED
    identifier: UNLICENSED

servers:
  - url: http://localhost:3001
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Guest sessions, account upgrade, login
  - name: users
    description: Current user profile
  - name: rooms
    description: Conversation rooms and membership
  - name: items
    description: Placements of messages within a room (send, reply, list, delete)
  - name: messages
    description: Reusable message content (share to other rooms)
  - name: reactions
    description: Per-user reactions on items
  - name: media
    description: File and recording uploads
  - name: stream
    description: Real-time room events (SSE)
  - name: workspaces
    description: Workspaces, members, invites, teams, activity and audit (doc/09)

paths:
  # ─── auth ──────────────────────────────────────────────────────────────────
  /auth/guest:
    post:
      operationId: createGuestSession
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Start a guest session
      description: Creates a guest user and sets the session cookie. Idempotent for a client that already holds a valid session — returns the existing user.
      security: []
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestInput' }
      responses:
        '201':
          description: Guest created — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '200':
          description: Existing session reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register:
    post:
      operationId: register
      x-fastify-config:
        rateLimit: { max: 10, timeWindow: '1 hour' }
      summary: Register, upgrading the current guest if a session is present
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Registered — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      operationId: login
      x-fastify-config:
        rateLimit: { max: 10, timeWindow: '15 minutes' }
      summary: Log in with email and password
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated — session token delivered via Set-Cookie (httpOnly)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        '200':
          description: Logged out — clears session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─── users ─────────────────────────────────────────────────────────────────
  /users/me:
    patch:
      operationId: updateCurrentUser
      summary: Update the current user
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/mutes:
    get:
      operationId: listMutes
      summary: People (and bots) I have muted — personal and global (doc/08 I5)
      tags: [users]
      responses:
        '200':
          description: Muted users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/mutes/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: muteUser
      summary: Mute someone everywhere. Their items reach you content-less; others are unaffected. Idempotent.
      tags: [users]
      responses:
        '200':
          description: Muted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unmuteUser
      summary: Unmute. Idempotent.
      tags: [users]
      responses:
        '200':
          description: Unmuted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Replace the current user's avatar
      description: |
        Signed-in accounts only. Stores the image and points the profile at it.
        The previous avatar file is deleted. Guests receive 403. JPEG, PNG, GIF, or WebP.
      tags: [users]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadAvatarInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ─── rooms ─────────────────────────────────────────────────────────────────
  /rooms:
    get:
      operationId: listRooms
      summary: Browse public rooms, most recently active first
      tags: [rooms]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchQuery'
        - in: query
          name: topic
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: Paginated public rooms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRoom
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Create a room; the caller becomes its owner
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomInput' }
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /rooms/mine:
    get:
      operationId: listMyRooms
      summary: Rooms the caller is a member of (public and private), most recently active first
      tags: [rooms]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated rooms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoom
      summary: Get a room
      description: Private rooms return 404 to non-members.
      tags: [rooms]
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRoom
      summary: Update a room (owner only)
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoomInput' }
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRoom
      summary: Delete a conversation (owner only)
      tags: [rooms]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/join:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      operationId: joinRoom
      summary: Join a room. Private rooms require a valid inviteCode. Idempotent.
      tags: [rooms]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRoomInput' }
      responses:
        '200':
          description: Joined (or already a member)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/bots:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomBots
      summary: Every available bot and whether it is seated in this room
      tags: [rooms]
      responses:
        '200':
          description: Bots with their seat in this room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBotList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/bots/{userId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: seatRoomBot
      summary: Add (seat) a bot in this room — owner only. Idempotent.
      tags: [rooms]
      responses:
        '200':
          description: Seated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: kickRoomBot
      summary: Remove (kick) a bot from this room — owner only; it stops at once. Its past items stay. Idempotent.
      tags: [rooms]
      responses:
        '200':
          description: Kicked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomBotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/participants:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomParticipants
      summary: Who is in this conversation — members and seated bots, with live presence
      description: |
        One roster for people and bots alike, so the client renders every participant
        the same way (doc/08 §2.3). `present` comes from deduplicated room presence;
        seated bots are always present. Private rooms return 404 to non-members.
      tags: [rooms]
      responses:
        '200':
          description: Participants, present first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/members/me:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    delete:
      operationId: leaveRoom
      summary: Leave a room. Owners cannot leave their own room.
      tags: [rooms]
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/invite-code:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      operationId: rotateInviteCode
      summary: Issue a new invite code for a private room (owner only); the old code stops working
      tags: [rooms]
      responses:
        '200':
          description: Room with new inviteCode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─── items ─────────────────────────────────────────────────────────────────
  /rooms/{roomId}/items:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomItems
      summary: Items in a room, ordered by number
      description: |
        Flat list; build branches client-side from `parentId`.
        Pass `after` (an item number) to fetch only items newer than one you already have —
        recovers newly created items only, not updates or deletions.
        Use `order=desc` for the newest window, then follow nextCursor for older pages.
      tags: [items]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
          description: Number ordering; desc starts with the newest items and pages backward.
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
          description: Only return items with number greater than this.
      responses:
        '200':
          description: Paginated items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedItems' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendMessage
      x-fastify-config:
        rateLimit: { max: 60, timeWindow: '1 minute' }
      summary: Send a new message to a room (top-level)
      description: |
        Requires membership (public rooms auto-join on first post). Must include text or
        at least one media id (400 `EMPTY_ITEM`). `mediaIds` must be uploads owned by the
        caller and not yet attached. Creates a new Message and an Item in the room.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageInput' }
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /items/{itemId}/replies:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: replyToItem
      x-fastify-config:
        rateLimit: { max: 60, timeWindow: '1 minute' }
      summary: Reply to an item
      description: |
        Creates a new Message and a child Item **in the parent's room** — the room is
        always taken from the parent, so a reply can never be placed in another room.
        404 if the parent isn't visible to the caller. Same content rules as sendMessage.
        Optional `anchorStartMs` attaches the reply to a **moment** (a point, not a
        segment) in the parent's audio/video. Allowed only when the parent has exactly one
        visible audio/video attachment with a known duration (else 400 `ANCHOR_UNSUPPORTED`),
        and must be ≤ that duration (else 400 `INVALID_ANCHOR`). Anchors live on this room's
        Item, so sharing the parent elsewhere carries none of them.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplyToItemInput' }
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/share:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    post:
      operationId: shareMessageToRooms
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 minute' }
      summary: Share an existing message to other rooms
      description: |
        Creates one top-level Item per target room that reuses the same Message and media —
        no content or upload is duplicated. Rooms where the message already has a live
        Item are skipped (idempotent); the response lists only newly created Items.
        Only the message's author may share it (403), so private-room content can't be
        re-published by others. All target rooms must be postable by the caller — public
        rooms auto-join, private rooms require membership (404 otherwise). All-or-nothing.
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareMessageInput' }
      responses:
        '201':
          description: Items created by this share (empty if every room already had it)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      operationId: getItem
      summary: Get an item
      tags: [items]
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteItem
      summary: Permanently delete a capture (author only). The placement stays so replies keep their parent.
      tags: [items]
      responses:
        '200':
          description: Tombstoned item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── reactions ─────────────────────────────────────────────────────────────
  /items/{itemId}/reactions/{type}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/ReactionTypeParam'
    put:
      operationId: addReaction
      summary: Add the caller's reaction (idempotent)
      tags: [reactions]
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeReaction
      summary: Remove the caller's reaction (idempotent)
      tags: [reactions]
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── media ─────────────────────────────────────────────────────────────────
  /media:
    post:
      operationId: uploadMedia
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 minute' }
      summary: Upload a recording or file; attach it by id in createItem
      tags: [media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadMediaInput' }
      responses:
        '201':
          description: Uploaded (not yet attached to an item)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /media/youtube:
    post:
      operationId: createYouTubeMedia
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 minute' }
      summary: Register a YouTube video as media (nothing is downloaded)
      description: |
        Resolves the link to a canonical video id, verifies the video exists (oEmbed) and stores
        its title — never the media itself. Attach the returned id via mediaIds like any upload.
        400 `INVALID_YOUTUBE_URL` for non-video links (incl. playlist-only),
        400 `YOUTUBE_UNAVAILABLE` for missing/private videos.
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateYouTubeMediaInput' }
      responses:
        '201':
          description: Registered (not yet attached to an item)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: YouTube lookup failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    delete:
      operationId: deleteMedia
      summary: Delete an upload that was never used (owner only)
      description: |
        For abandoned drafts. Only the owner's media that is attached to no message and is
        no room's thumbnail; the stored file goes too. 409 `MEDIA_IN_USE` otherwise.
      tags: [media]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Attached to a message or used as a thumbnail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /media/{mediaId}/playback:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      operationId: playbackMedia
      summary: Get playback URL for media
      description: |
        Returns a 307 redirect to the stored file. Authorized by a session that may see the
        media, or by `token` — the short-lived signed token in the `url` the API returns for
        the media (media elements with crossOrigin="anonymous" send no cookies).
      tags: [media]
      # Session optional: an anonymous request needs a valid token (checked in the handler).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: token
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        '307':
          description: Redirect to S3
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── stream ────────────────────────────────────────────────────────────────
  /rooms/{roomId}/stream:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      parameters:
        - in: query
          name: cursor
          schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        - in: header
          name: Last-Event-ID
          schema: { type: string }
      operationId: streamRoomEvents
      summary: Server-Sent Events for a room
      description: |
        `text/event-stream`. Each message's `event:` field is the StreamEvent `type`
        and `data:` is a hydrated StreamEvent. Every item change has a durable room
        sequence in `id:`. Resume with Last-Event-ID or the cursor query parameter
        from listRoomItems meta.changeCursor. Replay uses bounded batches of current
        item state, including tombstones and viewer-specific reactions.
        A `ping` comment is sent every 25s to keep proxies from closing the connection.
      tags: [stream]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each data payload is a JSON StreamEvent
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── workspaces (doc/09) ───────────────────────────────────────────────────
  /workspaces:
    get:
      operationId: listMyWorkspaces
      summary: Workspaces the caller is an active member of
      tags: [workspaces]
      responses:
        '200':
          description: Workspaces with the caller's role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createWorkspace
      x-fastify-config:
        rateLimit: { max: 20, timeWindow: '1 hour' }
      summary: Create a workspace; the caller becomes its owner
      description: Requires a registered account (403 REGISTRATION_REQUIRED for guests). A slug is derived from the name when omitted.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceInput' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: Get a workspace
      description: Non-members get 404.
      tags: [workspaces]
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWorkspace
      summary: Update a workspace (owner/admin)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceInput' }
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace (owner only; soft delete)
      tags: [workspaces]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceMembers
      summary: Members of a workspace
      tags: [workspaces]
      parameters:
        - in: query
          name: includeRemoved
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Members, earliest joined first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      operationId: updateWorkspaceMember
      summary: Update a member
      description: |
        Anyone may edit their own title and timezone. Role and status need owner/admin;
        only owners change owners or grant ownership. A workspace keeps at least one
        active owner (409 LAST_OWNER).
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceMemberInput' }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeWorkspaceMember
      summary: Remove a member, or leave (when it is the caller)
      description: The member row is kept with status `removed`; team memberships end.
      tags: [workspaces]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/invites:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceInvites
      summary: Pending invites (owner/admin)
      tags: [workspaces]
      responses:
        '200':
          description: Pending, unexpired invites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceInviteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createWorkspaceInvite
      x-fastify-config:
        rateLimit: { max: 50, timeWindow: '1 hour' }
      summary: Invite someone by email (owner/admin)
      description: |
        Returns the invite token once; deliver the link yourself (no email is sent yet).
        A new invite for the same email replaces the pending one. Expires in 7 days.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceInviteInput' }
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedWorkspaceInviteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: inviteId
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    delete:
      operationId: revokeWorkspaceInvite
      summary: Revoke a pending invite (owner/admin)
      tags: [workspaces]
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace-invites/accept:
    post:
      operationId: acceptWorkspaceInvite
      x-fastify-config:
        rateLimit: { max: 30, timeWindow: '1 hour' }
      summary: Accept an invite and join its workspace
      description: |
        The caller must be a registered account whose email matches the invite
        (403 REGISTRATION_REQUIRED / INVITE_EMAIL_MISMATCH). Invalid, used, revoked or
        expired tokens get 404 INVITE_INVALID. A removed member is re-activated.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptWorkspaceInviteInput' }
      responses:
        '200':
          description: The joined workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/teams:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listTeams
      summary: Teams in a workspace
      tags: [workspaces]
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Teams by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTeam
      summary: Create a team (owner/admin)
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamInput' }
      responses:
        '201':
          description: Team created (or the earlier result, for a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
    patch:
      operationId: updateTeam
      summary: Rename, describe, archive or restore a team (owner/admin)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamInput' }
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/teams/{teamId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/MemberId'
    put:
      operationId: setTeamMember
      summary: Add a member to a team, or change their team role (owner/admin or team lead)
      tags: [workspaces]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTeamMemberInput' }
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeTeamMember
      summary: Remove a member from a team (owner/admin, team lead, or the member themselves)
      tags: [workspaces]
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/activity:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceActivity
      summary: The workspace timeline, newest first
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/actions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceActions
      summary: Audit log of every action, newest first (owner/admin)
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: targetType
          schema: { type: string, minLength: 1, maxLength: 32 }
        - in: query
          name: targetId
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Paginated action executions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedActionExecutions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─── contacts, accounts, tags, notes, links (doc/09 slice 1) ───────────────
  /workspaces/{workspaceId}/contacts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listContacts
      summary: Contacts, by name
      description: |
        `q` matches the name (contains) or any email/phone/url (prefix). `accountId`: people currently at that account. Defaults to active contacts.
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: ownerMemberId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: tagId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: accountId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/RecordStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedContacts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createContact
      summary: Create a contact
      description: |
        Never refuses a likely duplicate (doc/09 D2): `duplicates` lists live contacts with the same personal email,
        or the same name at the same account. Role addresses (info@…) are stored as shared unless `shared: false`.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/match:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: matchContact
      summary: What the matcher concludes for an email
      description: |
        `match`: exactly one live contact holds it as a personal address; `ambiguous`: several do; `shared`: only as a
        shared/role address (never auto-matched); `none`. `account` applies the same rule to the email's domain.
      tags: [workspaces]
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: getContact
      summary: Get a contact
      description: |
        A merged contact resolves to the contact it was merged into (compare ids).
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContact
      summary: Update a contact
      description: |
        `points` and `tagIds`, when given, replace the current set.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteContact
      summary: Delete a contact (admins or its owner; soft delete)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/{contactId}/duplicates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: listContactDuplicates
      summary: Possible duplicates of a contact
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRefList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/{contactId}/merge:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ContactId'
    post:
      operationId: mergeContacts
      summary: Merge another contact into this one
      description: |
        Points, accounts, tags, links and timeline move to this contact (deduplicated); the other is deleted with
        `mergedIntoId` set. Needs delete rights on the merged-away contact (admin or its owner).
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeContactsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/contacts/{contactId}/timeline:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ContactId'
    get:
      operationId: getContactTimeline
      summary: Activity about a contact, newest first
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contacts/{contactId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ContactId'
      - $ref: '#/components/parameters/AccountId'
    put:
      operationId: setContactAccount
      summary: Link a contact to an account, or update that link
      description: |
        `isPrimary` makes it the contact's one primary account. Set `endedAt` when they leave (history stays).
      tags: [workspaces]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetContactAccountInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeContactAccount
      summary: Remove a contact–account link
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/accounts:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listAccounts
      summary: Accounts, by name
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: ownerMemberId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: tagId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/AccountType' }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/RecordStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAccounts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAccount
      summary: Create an account
      description: |
        `duplicates` lists live accounts with the same domain (a signal, not a block). Personal email domains
        (gmail.com…) are refused as company domains (400 FREE_MAIL_DOMAIN).
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAccount
      summary: Get an account
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      summary: Update an account
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteAccount
      summary: Delete an account (admins or its owner; soft delete)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/accounts/{accountId}/timeline:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAccountTimeline
      summary: Activity about an account and the people at it, newest first
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/tags:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listTags
      summary: Tags in a workspace
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTag
      summary: Create a tag (any member)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TagId'
    patch:
      operationId: updateTag
      summary: Rename or recolour a tag (owner/admin)
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTagInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTag
      summary: Delete a tag from every record (owner/admin)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/notes:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listNotes
      summary: Notes on a contact or account, newest first
      description: |
        Give exactly one of `contactId` or `accountId`.
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: contactId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: accountId
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedNotes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createNote
      summary: Add a note (text and/or media) to contacts and accounts
      description: |
        Media: the caller's own uploads (POST /media), not yet attached — a voice or video note plays like any capture.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNoteInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NoteId'
    get:
      operationId: getNote
      summary: Get a note
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateNote
      summary: Pin or unpin a note
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNoteInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteNote
      summary: Delete a note (admins or its author)
      description: |
        Room placements made by sharing stay (they are separate publications); a note never shared is purged.
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/notes/{noteId}/share:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NoteId'
    post:
      operationId: shareNote
      summary: Share a note into conversations (its author only)
      description: |
        Same rules as shareMessageToRooms. Deleting the capture in a room later removes it everywhere, the note's content included.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareMessageInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/links:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listRecordLinks
      summary: Links of one contact, account, note or room
      description: |
        Filter by exactly one. A linked room the caller can't see is returned without its id or title.
      tags: [workspaces]
      parameters:
        - in: query
          name: contactId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: accountId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: noteId
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: roomId
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordLinkList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRecordLink
      summary: Link a contact or account to a note or a conversation
      description: |
        Exactly one subject (`contactId`/`accountId`) and one object (`noteId`, or `roomId` with an optional `itemId`).
        Linking a room requires being able to see it. Conversations are linked, never owners of the record.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRecordLinkInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordLinkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/LinkId'
    delete:
      operationId: deleteRecordLink
      summary: Remove a link
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/links:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: listRoomLinks
      summary: Records linked to a conversation, from the caller’s workspaces
      description: |
        Only links from workspaces the caller is an active member of; nobody else learns a link exists.
      tags: [rooms]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordLinkList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token. Web clients send it as the httpOnly `token` cookie; native clients as a Bearer header.

  parameters:
    Cursor:
      in: query
      name: cursor
      schema: { type: string, maxLength: 512 }
      description: Opaque cursor returned by the previous page.
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQuery:
      in: query
      name: q
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: Simple text search within this resource.
    RoomId:
      in: path
      name: roomId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ItemId:
      in: path
      name: itemId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ReactionTypeParam:
      in: path
      name: type
      required: true
      schema: { $ref: '#/components/schemas/ReactionType' }

    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    MemberId:
      in: path
      name: memberId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      description: A WorkspaceMember id (not a user id)
    TeamId:
      in: path
      name: teamId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ContactId:
      in: path
      name: contactId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    TagId:
      in: path
      name: tagId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    NoteId:
      in: path
      name: noteId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    LinkId:
      in: path
      name: linkId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string, minLength: 1, maxLength: 120 }
      description: Repeating a succeeded request with the same key returns its result instead of acting twice; reusing a key for a different request is 409 IDEMPOTENCY_KEY_REUSED.

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ─── shared ──────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    NullResponse:
      type: object
      required: [data]
      properties:
        data: { type: 'null' }

    PaginatedMeta:
      type: object
      required: [hasMore, nextCursor]
      properties:
        changeCursor: { type: string, description: Durable room change sequence for item pages }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }

    # ─── users ───────────────────────────────────────────────────────────────
    UserKind:
      type: string
      enum: [human, bot]
      description: Data for data-layer rules (human-authored activity, doc/08 I6). Components render `tag`, never branch on this.

    User:
      type: object
      required: [id, email, isGuest, kind, tag, displayName, avatarUrl, createdAt]
      properties:
        id: { type: string }
        email: { type: [string, 'null'] }
        isGuest: { type: boolean }
        kind: { $ref: '#/components/schemas/UserKind' }
        tag: { type: [string, 'null'], description: 'Short disclosure suffix shown after the name, e.g. BOT; null for people' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    GuestInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }

    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 50 }

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }

    UpdateMeInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        avatarUrl: { type: [string, 'null'], maxLength: 512 }

    UploadAvatarInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }

    Author:
      type: object
      required: [id, name, avatarUrl, kind, tag]
      properties:
        id: { type: string }
        name: { type: string }
        avatarUrl: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/UserKind' }
        tag: { type: [string, 'null'], description: 'Short disclosure suffix shown after the name, e.g. BOT; null for people' }

    ParticipantRole:
      type: string
      enum: [owner, member, bot]

    Participant:
      type: object
      required: [user, role, present]
      properties:
        user: { $ref: '#/components/schemas/Author' }
        role: { $ref: '#/components/schemas/ParticipantRole' }
        present: { type: boolean, description: Connected to this room now (deduplicated; a refresh does not flip it) }

    AuthorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Author' }

    AuthorResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Author' }

    RoomBot:
      type: object
      required: [user, handle, kind, seated]
      properties:
        user: { $ref: '#/components/schemas/Author' }
        handle: { type: string }
        kind: { type: string, enum: [house, optional], description: 'house = seated by default; optional = only when added' }
        seated: { type: boolean }

    RoomBotList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RoomBot' }

    RoomBotResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RoomBot' }

    ParticipantList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Participant' }

    # ─── rooms ───────────────────────────────────────────────────────────────
    RoomVisibility:
      type: string
      enum: [public, private]

    RoomRole:
      type: string
      enum: [owner, member]

    Room:
      type: object
      required:
        [id, number, title, description, thumbnail, topic, visibility, ownerId, itemCount, responseCount, durationMs, memberCount, lastActivityAt, createdAt, role, inviteCode]
      properties:
        id: { type: string }
        number: { type: integer, description: 'Human-facing room sequence ("CONVERSATION 018")' }
        title: { type: string }
        description: { type: string }
        thumbnail:
          description: Conversation image
          oneOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
        topic: { type: [string, 'null'] }
        visibility: { $ref: '#/components/schemas/RoomVisibility' }
        ownerId: { type: string }
        itemCount: { type: integer }
        responseCount: { type: integer, description: Live items after the opening one }
        durationMs: { type: integer, description: Total audio/video time of the live items (ms) }
        memberCount: { type: integer }
        lastActivityAt: { type: string, format: date-time }
        lastResponseAt: { type: [string, 'null'], format: date-time, description: 'Newest live item after the opening one; null when there is none' }
        createdAt: { type: string, format: date-time }
        role:
          description: The caller's membership role, or null if not a member
          oneOf:
            - $ref: '#/components/schemas/RoomRole'
            - type: 'null'
        inviteCode:
          type: [string, 'null']
          description: Present only for members of a private room

    RoomResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Room' }

    PaginatedRooms:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Room' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    CreateRoomInput:
      type: object
      additionalProperties: false
      description: Every field is optional; a conversation may have no name, description or thumbnail.
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        thumbnailId:
          type: string
          minLength: 1
          maxLength: 64
          description: The caller's own image, or a YouTube video they added. 400 INVALID_THUMBNAIL otherwise.
        topic: { type: string, minLength: 1, maxLength: 40 }
        visibility: { $ref: '#/components/schemas/RoomVisibility' }

    UpdateRoomInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        thumbnailId: { type: string, minLength: 1, maxLength: 64 }
        topic: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        visibility: { $ref: '#/components/schemas/RoomVisibility' }

    JoinRoomInput:
      type: object
      additionalProperties: false
      properties:
        inviteCode: { type: string, minLength: 1, maxLength: 32 }

    # ─── items ───────────────────────────────────────────────────────────────
    MediaType:
      type: string
      enum: [audio, video, image, file]

    Media:
      type: object
      required: [id, type, source, url, mimeType, size, duration, name, poster, externalId, title, embeddable]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/MediaType' }
        source:
          type: string
          enum: [stored, youtube]
          description: stored = our upload/capture; youtube = external video (never downloaded)
        url: { type: string }
        mimeType: { type: string }
        size: { type: integer, description: Bytes }
        duration: { type: [number, 'null'], description: Seconds (audio/video) }
        name: { type: [string, 'null'] }
        poster: { type: [string, 'null'], description: Poster image URL (video) }
        externalId: { type: [string, 'null'], description: Canonical YouTube video id (source youtube) }
        title: { type: [string, 'null'], description: External title (source youtube) }
        embeddable:
          type: boolean
          description: Whether the media can be played inline. Non-embeddable YouTube shows a link card; its duration is null, so it cannot be anchored.

    MediaResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Media' }

    UploadMediaInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        type:
          $ref: '#/components/schemas/MediaType'
          description: Defaults from the file's mime type
        name: { type: string, maxLength: 255 }
        duration: { type: number, minimum: 0 }

    ReactionType:
      type: string
      enum: [like, ack, laugh]

    ReactionSummary:
      type: object
      required: [type, count, reacted]
      properties:
        type: { $ref: '#/components/schemas/ReactionType' }
        count: { type: integer, minimum: 1 }
        reacted: { type: boolean, description: Whether the caller has this reaction }

    Message:
      type: object
      description: Reusable content (author, text, media). Hydrated on every Item.
      required: [id, author, text, media, createdAt]
      properties:
        id: { type: string }
        author: { $ref: '#/components/schemas/Author' }
        text: { type: [string, 'null'], description: Null when the Item placement is deleted }
        media:
          type: array
          description: Empty when the Item placement is deleted
          items: { $ref: '#/components/schemas/Media' }
        createdAt: { type: string, format: date-time }

    Item:
      type: object
      description: |
        Placement of a Message inside one room. The same Message can be placed in many
        rooms (share); each placement has its own number, thread position and reactions.
      required: [id, roomId, messageId, number, parentId, anchorStartMs, chat, message, reactions, createdAt, deletedAt]
      properties:
        id: { type: string }
        roomId: { type: string }
        messageId: { type: string }
        number: { type: integer, description: 'Per-room sequence ("RE:003")' }
        parentId: { type: [string, 'null'] }
        anchorStartMs:
          type: [integer, 'null']
          minimum: 0
          description: Moment (ms) in the parent's media this reply anchors to; null when un-anchored. A point, not a range.
        chat:
          type: boolean
          description: Posted from the room chat. These stay in the chat and are not played on the stage.
        message: { $ref: '#/components/schemas/Message' }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ReactionSummary' }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }


    ItemResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Item' }

    PaginatedItems:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    SendMessageInput:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 4000 }
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        chat:
          type: boolean
          description: Room chat message. Not a stage broadcast, and not a reply.

    ReplyToItemInput:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 4000 }
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        anchorStartMs:
          type: integer
          minimum: 0
          description: |
            The moment (ms from start) in the parent's single audio/video attachment this
            reply responds to. A point, not a range — V1 has no anchor end.
            Stage-only: rejected with `chat: true`.
        chat:
          type: boolean
          description: |
            Surface of the new reply: true = room chat, false/omitted = stage. Independent of
            the parent's surface — the reply link never decides where an item shows (doc/08 I3).

    CreateYouTubeMediaInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048, description: Any common YouTube video link; resolved to a canonical id }
        durationMs: { type: integer, minimum: 0, maximum: 86400000, description: "Measured by the client's player; V1 trusts it, as with upload durations" }
        embeddable: { type: boolean, default: true, description: False when the client's player reports embedding disabled (101/150) }

    ShareResultResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Item' }

    ShareMessageInput:
      type: object
      required: [roomIds]
      additionalProperties: false
      properties:
        roomIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }

    # ─── stream ──────────────────────────────────────────────────────────────
    StreamEventType:
      type: string
      enum: [item.created, item.updated]

    ParticipantsEvent:
      type: object
      description: |
        SSE `participants.updated`: someone arrived or left (deduplicated presence), or a
        bot was seated/kicked. Refetch `listRoomParticipants`.
      required: [type, roomId]
      properties:
        type: { type: string, enum: [participants.updated] }
        roomId: { type: string }

    StreamEvent:
      type: object
      description: |
        Payload of each SSE message. `item.updated` covers reactions and tombstones.
        Contains current item state and viewer-specific reactions; no item GET is needed.
      required: [type, actorId, itemId, itemNumber, cursor, item]
      properties:
        type: { $ref: '#/components/schemas/StreamEventType' }
        actorId: { type: string, description: User whose action produced this event }
        itemId: { type: string }
        itemNumber: { type: integer }
        cursor: { type: string }
        item: { $ref: '#/components/schemas/Item' }

    # ─── workspaces (doc/09) ─────────────────────────────────────────────────
    WorkspaceRole:
      type: string
      enum: [owner, admin, member]

    MemberStatus:
      type: string
      enum: [active, suspended, removed]

    TeamRole:
      type: string
      enum: [lead, member]

    Workspace:
      type: object
      required: [id, name, slug, timezone, defaultCurrency, createdAt, role]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string, description: IANA time zone }
        defaultCurrency: { type: string, description: ISO 4217 code }
        createdAt: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/WorkspaceRole' }

    WorkspaceResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Workspace' }

    WorkspaceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }

    CreateWorkspaceInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, minLength: 1, maxLength: 60, pattern: '^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?$' }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        defaultCurrency: { type: string, pattern: '^[A-Z]{3}$' }

    UpdateWorkspaceInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, minLength: 1, maxLength: 60, pattern: '^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?$' }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        defaultCurrency: { type: string, pattern: '^[A-Z]{3}$' }

    WorkspaceMember:
      type: object
      required: [id, workspaceId, user, email, role, status, title, timezone, joinedAt, removedAt]
      properties:
        id: { type: string, description: Member id — what owner/assignee fields reference }
        workspaceId: { type: string }
        user: { $ref: '#/components/schemas/Author' }
        email: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        title: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        joinedAt: { type: string, format: date-time }
        removedAt: { type: [string, 'null'], format: date-time }

    WorkspaceMemberResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WorkspaceMember' }

    WorkspaceMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMember' }

    UpdateWorkspaceMemberInput:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        status: { type: string, enum: [active, suspended], description: Removal is DELETE }
        title: { type: [string, 'null'], maxLength: 120 }
        timezone: { type: [string, 'null'], minLength: 1, maxLength: 64 }

    WorkspaceInvite:
      type: object
      required: [id, workspaceId, email, role, invitedById, expiresAt, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        invitedById: { type: string, description: WorkspaceMember id }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WorkspaceInviteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceInvite' }

    CreatedWorkspaceInviteResponse:
      type: object
      required: [data, token]
      properties:
        data: { $ref: '#/components/schemas/WorkspaceInvite' }
        token: { type: string, description: Shown once; only its hash is stored. Accept with acceptWorkspaceInvite. }

    CreateWorkspaceInviteInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [admin, member], default: member }

    AcceptWorkspaceInviteInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }

    Team:
      type: object
      required: [id, workspaceId, name, description, archivedAt, createdAt, members]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            required: [memberId, role]
            properties:
              memberId: { type: string }
              role: { $ref: '#/components/schemas/TeamRole' }

    TeamResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Team' }

    TeamList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Team' }

    CreateTeamInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }

    UpdateTeamInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
        archived: { type: boolean }

    SetTeamMemberInput:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/TeamRole' }

    Activity:
      type: object
      required: [id, type, occurredAt, actorMemberId, actor, noteId, roomId, itemId, subjects, summary]
      properties:
        id: { type: string }
        type: { type: string, description: 'Namespaced event, e.g. member.joined, team.created' }
        occurredAt: { type: string, format: date-time }
        actorMemberId: { type: [string, 'null'] }
        actor:
          oneOf:
            - $ref: '#/components/schemas/Author'
            - type: 'null'
        noteId: { type: [string, 'null'], description: The note this event is about }
        roomId: { type: [string, 'null'], description: "The conversation this event is about; null when the caller can't see it" }
        itemId: { type: [string, 'null'] }
        subjects:
          type: array
          items: { type: string }
          description: 'Records this event is about, e.g. contact:<id>'
        summary:
          type: object
          additionalProperties: true
          description: Display snapshot for this event type (names at the time it happened)

    PaginatedActivity:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    ActionExecution:
      type: object
      required: [id, action, status, actorKind, actorMemberId, actorUserId, origin, targetType, targetId, input, changes, result, errorCode, requestedAt, finishedAt]
      properties:
        id: { type: string }
        action: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, rejected] }
        actorKind: { type: string, enum: [member, system, integration] }
        actorMemberId: { type: [string, 'null'] }
        actorUserId: { type: [string, 'null'] }
        origin: { type: string, enum: [ui, api, import, sync, system] }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        input: {}
        changes: { description: '{ field: [before, after] }, or null' }
        result: {}
        errorCode: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    PaginatedActionExecutions:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ActionExecution' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    # ─── contacts, accounts, tags, notes, links (doc/09 slice 1) ─────────────
    RecordStatus:
      type: string
      enum: [active, archived]

    RecordOrigin:
      type: string
      enum: [manual, import, inbox, calendar, conversation, api, sync]
      description: How the record was created (not why the person showed up)

    ContactPointKind:
      type: string
      enum: [email, phone, url, social]

    AccountType:
      type: string
      enum: [prospect, customer, partner, vendor, other]

    LinkOrigin:
      type: string
      enum: [manual, auto_match, import, system]

    MatchResult:
      type: string
      enum: [match, none, ambiguous, shared]

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: [string, 'null'] }

    TagResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Tag' }

    TagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    CreateTagInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: [string, 'null'], maxLength: 16 }

    UpdateTagInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: [string, 'null'], maxLength: 16 }

    ContactPoint:
      type: object
      required: [id, kind, value, label, isPrimary, shared]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ContactPointKind' }
        value: { type: string }
        label: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        shared: { type: boolean, description: 'A shared/role address (info@…): never auto-matched to this person' }

    ContactPointInput:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { $ref: '#/components/schemas/ContactPointKind' }
        value: { type: string, minLength: 1, maxLength: 255 }
        label: { type: [string, 'null'], maxLength: 40 }
        isPrimary: { type: boolean }
        shared: { type: boolean }

    ContactAccountLink:
      type: object
      required: [accountId, name, role, isPrimary, startedAt, endedAt]
      properties:
        accountId: { type: string }
        name: { type: string }
        role: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }

    Contact:
      type: object
      required: [id, workspaceId, firstName, lastName, displayName, title, status, ownerMemberId, teamId, primaryEmail, primaryPhone, lastActivityAt, origin, externalProvider, externalId, createdAt, updatedAt, points, accounts, tags]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        displayName: { type: string }
        title: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RecordStatus' }
        ownerMemberId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        primaryEmail: { type: [string, 'null'] }
        primaryPhone: { type: [string, 'null'] }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        origin: { $ref: '#/components/schemas/RecordOrigin' }
        externalProvider: { type: [string, 'null'] }
        externalId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/ContactPoint' }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/ContactAccountLink' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    ContactRef:
      type: object
      required: [id, displayName, primaryEmail]
      properties:
        id: { type: string }
        displayName: { type: string }
        primaryEmail: { type: [string, 'null'] }

    ContactResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Contact' }

    CreatedContactResponse:
      type: object
      required: [data, duplicates]
      properties:
        data: { $ref: '#/components/schemas/Contact' }
        duplicates:
          type: array
          items: { $ref: '#/components/schemas/ContactRef' }

    ContactRefList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContactRef' }

    PaginatedContacts:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    CreateContactInput:
      type: object
      additionalProperties: false
      description: Needs a name, an email or a phone (400 EMPTY_CONTACT). displayName defaults to first + last name.
      properties:
        firstName: { type: [string, 'null'], maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        displayName: { type: [string, 'null'], maxLength: 160 }
        title: { type: [string, 'null'], maxLength: 120 }
        status: { $ref: '#/components/schemas/RecordStatus' }
        ownerMemberId: { type: [string, 'null'], maxLength: 64 }
        teamId: { type: [string, 'null'], maxLength: 64 }
        points:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ContactPointInput' }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        accounts:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [accountId]
            properties:
              accountId: { type: string, minLength: 1, maxLength: 64 }
              role: { type: [string, 'null'], maxLength: 80 }
              isPrimary: { type: boolean }
        externalProvider: { type: [string, 'null'], maxLength: 32 }
        externalId: { type: [string, 'null'], maxLength: 255 }

    UpdateContactInput:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: [string, 'null'], maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        displayName: { type: [string, 'null'], maxLength: 160, description: 'null re-derives it from the name or primary email/phone' }
        title: { type: [string, 'null'], maxLength: 120 }
        status: { $ref: '#/components/schemas/RecordStatus' }
        ownerMemberId: { type: [string, 'null'], maxLength: 64 }
        teamId: { type: [string, 'null'], maxLength: 64 }
        points:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ContactPointInput' }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        externalProvider: { type: [string, 'null'], maxLength: 32 }
        externalId: { type: [string, 'null'], maxLength: 255 }

    MergeContactsInput:
      type: object
      additionalProperties: false
      required: [mergeContactId]
      properties:
        mergeContactId: { type: string, minLength: 1, maxLength: 64, description: The contact folded into this one and deleted }

    SetContactAccountInput:
      type: object
      additionalProperties: false
      properties:
        role: { type: [string, 'null'], maxLength: 80 }
        isPrimary: { type: boolean }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }

    AccountRef:
      type: object
      required: [id, name, domain]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: [string, 'null'] }

    ContactMatch:
      type: object
      required: [email, result, matchId, contacts, account]
      properties:
        email: { type: string }
        result: { $ref: '#/components/schemas/MatchResult' }
        matchId: { type: [string, 'null'], description: The matched contact when result is match }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/ContactRef' }
        account:
          type: object
          required: [result, matchId, accounts]
          properties:
            result: { $ref: '#/components/schemas/MatchResult' }
            matchId: { type: [string, 'null'] }
            accounts:
              type: array
              items: { $ref: '#/components/schemas/AccountRef' }

    ContactMatchResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ContactMatch' }

    Account:
      type: object
      required: [id, workspaceId, name, domain, website, industry, sizeBand, type, status, parentAccountId, ownerMemberId, teamId, lastActivityAt, origin, externalProvider, externalId, createdAt, updatedAt, contactCount, tags]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        domain: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        industry: { type: [string, 'null'] }
        sizeBand: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/AccountType' }
        status: { $ref: '#/components/schemas/RecordStatus' }
        parentAccountId: { type: [string, 'null'] }
        ownerMemberId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        origin: { $ref: '#/components/schemas/RecordOrigin' }
        externalProvider: { type: [string, 'null'] }
        externalId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        contactCount: { type: integer, description: People currently at this account }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    AccountResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Account' }

    CreatedAccountResponse:
      type: object
      required: [data, duplicates]
      properties:
        data: { $ref: '#/components/schemas/Account' }
        duplicates:
          type: array
          items: { $ref: '#/components/schemas/AccountRef' }

    PaginatedAccounts:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    CreateAccountInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        domain: { type: [string, 'null'], maxLength: 255 }
        website: { type: [string, 'null'], maxLength: 255 }
        industry: { type: [string, 'null'], maxLength: 80 }
        sizeBand: { type: [string, 'null'], maxLength: 16 }
        type: { $ref: '#/components/schemas/AccountType' }
        status: { $ref: '#/components/schemas/RecordStatus' }
        parentAccountId: { type: [string, 'null'], maxLength: 64 }
        ownerMemberId: { type: [string, 'null'], maxLength: 64 }
        teamId: { type: [string, 'null'], maxLength: 64 }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        externalProvider: { type: [string, 'null'], maxLength: 32 }
        externalId: { type: [string, 'null'], maxLength: 255 }

    UpdateAccountInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        domain: { type: [string, 'null'], maxLength: 255 }
        website: { type: [string, 'null'], maxLength: 255 }
        industry: { type: [string, 'null'], maxLength: 80 }
        sizeBand: { type: [string, 'null'], maxLength: 16 }
        type: { $ref: '#/components/schemas/AccountType' }
        status: { $ref: '#/components/schemas/RecordStatus' }
        parentAccountId: { type: [string, 'null'], maxLength: 64 }
        ownerMemberId: { type: [string, 'null'], maxLength: 64 }
        teamId: { type: [string, 'null'], maxLength: 64 }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        externalProvider: { type: [string, 'null'], maxLength: 32 }
        externalId: { type: [string, 'null'], maxLength: 255 }

    Note:
      type: object
      required: [id, workspaceId, messageId, authorMemberId, author, text, media, contentRemoved, pinnedAt, createdAt, subjects]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        messageId: { type: string, description: The capture behind the note (what shareNote places in rooms) }
        authorMemberId: { type: string }
        author: { $ref: '#/components/schemas/Author' }
        text: { type: [string, 'null'] }
        media:
          type: array
          items: { $ref: '#/components/schemas/Media' }
        contentRemoved: { type: boolean, description: 'The capture was deleted in a room it was shared to, which removes it everywhere' }
        pinnedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        subjects:
          type: array
          items: { type: string }
          description: 'Records it is attached to, e.g. contact:<id>, account:<id>'

    NoteResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Note' }

    PaginatedNotes:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    CreateNoteInput:
      type: object
      additionalProperties: false
      description: Needs text or media, and at least one contact or account.
      properties:
        text: { type: string, maxLength: 10000 }
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        contactIds:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 64 }
        accountIds:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 64 }

    UpdateNoteInput:
      type: object
      additionalProperties: false
      properties:
        pinned: { type: boolean }

    RecordLink:
      type: object
      required: [id, workspaceId, subject, object, how, linkedById, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        subject:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [contact, account] }
            id: { type: string }
            name: { type: string }
        object:
          type: object
          required: [type, noteId, room, itemId]
          properties:
            type: { type: string, enum: [note, room, item] }
            noteId: { type: [string, 'null'] }
            room:
              description: null when the caller can't see the conversation (or it was deleted)
              oneOf:
                - type: object
                  required: [id, number, title]
                  properties:
                    id: { type: string }
                    number: { type: integer }
                    title: { type: string }
                - type: 'null'
            itemId: { type: [string, 'null'] }
        how: { $ref: '#/components/schemas/LinkOrigin' }
        linkedById: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    RecordLinkResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RecordLink' }

    RecordLinkList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RecordLink' }

    CreateRecordLinkInput:
      type: object
      additionalProperties: false
      description: Exactly one of contactId/accountId, and exactly one of noteId/roomId (itemId only with roomId).
      properties:
        contactId: { type: string, minLength: 1, maxLength: 64 }
        accountId: { type: string, minLength: 1, maxLength: 64 }
        noteId: { type: string, minLength: 1, maxLength: 64 }
        roomId: { type: string, minLength: 1, maxLength: 64 }
        itemId: { type: string, minLength: 1, maxLength: 64 }
