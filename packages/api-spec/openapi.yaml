            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        mapping: { $ref: '#/components/schemas/InventoryImportMapping' }
        options: { $ref: '#/components/schemas/InventoryImportOptions' }
        totalRows: { type: integer }
        counts: { $ref: '#/components/schemas/ContactImportCounts' }
        previousImportId: { type: [string, 'null'] }
        resultDocumentId: { type: [string, 'null'] }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        rowsPrunedAt: { type: [string, 'null'], format: date-time }

    InventoryImportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/InventoryImport' }

    InventoryImportList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InventoryImport' }

    InventoryImportRef:
      type: object
      required: [id, name, sku]
      properties:
        id: { type: string }
        name: { type: string }
        sku: { type: [string, 'null'] }

    InventoryImportRow:
      type: object
      required: [id, rowNumber, sourceRowId, values, proposal, errorCode, candidates, proposedInventoryId, duplicateOfRow, resolution, resolvedInventoryId, outcome, outcomeNote, item]
      properties:
        id: { type: string }
        rowNumber: { type: integer }
        sourceRowId: { type: [string, 'null'] }
        values:
          type: [object, 'null']
          additionalProperties: { type: string }
        proposal: { $ref: '#/components/schemas/ImportProposal' }
        errorCode: { type: [string, 'null'] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/InventoryImportRef' }
        proposedInventoryId: { type: [string, 'null'] }
        duplicateOfRow: { type: [integer, 'null'] }
        resolution: { type: [string, 'null'], enum: [create, use, skip, null] }
        resolvedInventoryId: { type: [string, 'null'] }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/ImportOutcome'
            - type: 'null'
        outcomeNote: { type: [string, 'null'] }
        item:
          oneOf:
            - $ref: '#/components/schemas/InventoryImportRef'
            - type: 'null'

    PaginatedInventoryImportRows:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InventoryImportRow' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    # ─── shared native content (doc/10 §10 POC) ──────────────────────────────
    ContentBlock:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [section, title, paragraph, media] }
        level: { type: string, enum: [body, h3, h2, h1], description: "Heading size. Absent on older blocks: title reads as h1, paragraph and media as body." }
        text: { type: string, maxLength: 20000 }
        mediaName: { type: string, maxLength: 255 }
        mediaKind: { type: string, enum: [image, video, audio, file] }

    DocumentContent:
      type: object
      required: [version, content, updatedAt, updatedBy]
      properties:
        version: { type: integer, minimum: 0, description: 0 = nothing saved yet }
        content:
          description: Blocks (a block document) or a typed sheet (a native grid); null = nothing yet.
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/ContentBlock' }
            - $ref: '#/components/schemas/SheetContent'
            - type: 'null'
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/Author'
            - type: 'null'

    DocumentContentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DocumentContent' }

    SaveDocumentContentInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, content]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        content:
          oneOf:
            - type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/ContentBlock' }
            - $ref: '#/components/schemas/SheetContent'

    SheetContent:
      type: object
      additionalProperties: false
      description: |
        A native sheet (packages/shared/src/sheetContent.ts). Raw values per column type:
        text string · number · money = integer minor units in the column currency ·
        date YYYY-MM-DD · boolean. Totals are computed from `total: sum`, never stored.
        No formulas. Checked field by field on save → 400 INVALID_CONTENT.
      required: [schemaVersion, columns, rows]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        columns:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, label, type]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              label: { type: string, maxLength: 200 }
              type: { type: string, enum: [text, number, money, date, boolean] }
              currency: { type: string, minLength: 3, maxLength: 3 }
              total: { type: string, enum: [sum] }
        rows:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [id, cells]
            properties:
              id: { type: string, minLength: 1, maxLength: 64 }
              cells:
                type: object
                additionalProperties:
                  type: [string, number, boolean, 'null']

    DocumentPresenceInput:
      type: object
      additionalProperties: false
      required: [editing]
      properties:
        editing: { type: boolean }

    DocumentStreamEvent:
      description: Payload of each document SSE message (typing for clients)
      oneOf:
        - type: object
          required: [type, version, memberId, name]
          properties:
            type: { type: string, enum: [document.updated] }
            version: { type: integer }
            memberId: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
        - type: object
          required: [type, people]
          properties:
            type: { type: string, enum: [document.presence] }
            people:
              type: array
              items:
                type: object
                required: [memberId, name, editing]
                properties:
                  memberId: { type: string }
                  name: { type: string }
                  editing: { type: boolean }
