      required: [data]
      properties:
        data:
          type: object
          required: [removed, agentsMovedToDefault]
          properties:
            removed: { type: boolean }
            agentsMovedToDefault: { type: integer }

    UpdateEmailConnectionInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        replyTo: { type: [string, 'null'], maxLength: 254 }
        fromAddress: { type: string, maxLength: 254, description: Own senders only }
        makeDefault: { type: boolean, enum: [true] }
        smtp:
          type: object
          additionalProperties: false
          minProperties: 1
          description: Own SMTP senders only; omitted fields keep their value
          properties:
            host: { type: string, minLength: 1, maxLength: 253 }
            port: { type: integer, enum: [25, 465, 587, 2525] }
            security: { $ref: '#/components/schemas/SmtpSecurity' }
            username: { type: string, minLength: 1, maxLength: 254 }
            password: { type: string, minLength: 1, maxLength: 500, writeOnly: true }

    EmailConnectionTestResponse:
