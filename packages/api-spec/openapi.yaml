        - in: query
          name: focus
          description: Working view over active items (out = tracked quantity zero; low = at or below threshold)
          schema: { type: string, enum: [offered, paused, out, low] }
        - in: query
          name: sort
          schema: { type: string, enum: [name, price, updated, quantity], default: name }
