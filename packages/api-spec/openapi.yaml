        data:
          type: object
          required: [ok, sentTo, providerMessageId, error, connection]
          properties:
            ok: { type: boolean }
            sentTo: { type: [string, 'null'] }
            providerMessageId: { type: [string, 'null'], description: "The provider's id for the sent email (e.g. Resend's)" }
