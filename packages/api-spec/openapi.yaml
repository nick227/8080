      tags: [proposals]
      responses:
        '200':
          description: The undone proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/proposals/{proposalId}/revert:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: revertProposal
      summary: Propose putting back what an applied proposal replaced, against the record as it is now
      tags: [proposals]
      responses:
        '201':
          description: The new, corrective proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/proposals/{proposalId}/refresh:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: refreshProposal
      summary: Propose an expired change again, against the record as it is now
      tags: [proposals]
      responses:
        '201':
          description: The new proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/channel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: openWorkspaceChannel
      summary: The workspace's shared bot channel (created on first use)
      description: |
        doc/12 §3. One transparent channel per workspace where chatbot hosts: every
        active member is a member of its room and is welcomed there once (the creator's
        welcome starts the company-profile setup). Idempotent.
      tags: [workspaces]
      responses:
        '200':
          description: The channel's room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceChannelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/company-profile:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getCompanyProfile
      summary: The workspace's company profile (doc/12 §5.2)
      tags: [workspaces]
      responses:
        '200':
          description: Current facts; empty until the setup has run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCompanyProfile
      summary: Edit company profile — ordinary fields, saved together
      description: |
        Only the fields given change. Saved only if the profile is still at
        `expectedRevision` (else 409 PROFILE_REVISION_CONFLICT). What a person sets here
        is final: the setup's reading never replaces it. Lists replace the whole list.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCompanyProfileInput' }
      responses:
        '200':
          description: The profile after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/company-profile/images:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listCompanyImages
      summary: Gallery images for the company profile
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordImageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: uploadCompanyImage
      summary: Upload a company gallery image
      description: Multipart field `file` (image only). At most 12 images. First image becomes primary.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordImageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /workspaces/{workspaceId}/company-profile/images/order:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      operationId: reorderCompanyImages
      summary: Reorder company gallery images
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderRecordImagesInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordImageList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/company-profile/images/{imageId}/primary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
