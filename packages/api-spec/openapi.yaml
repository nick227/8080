  # ─── canonical contact import (doc/10 §7A) ─────────────────────────────────
  /workspaces/{workspaceId}/contact-imports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listContactImports
      summary: Recent contact imports (newest first, up to 50)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createContactImport
      summary: Preview importing a table as contacts
      description: |
        The explicit canonical import (an ordinary spreadsheet import never creates contacts). Source: pasted CSV,
        or a spreadsheet document with imported rows. Without `mapping`, columns are mapped from their headers;
        the preview proposes create / match / review / duplicate / invalid per row through the one matcher. Nothing
        is written to contacts until commit. `previousImportId` warns when the same table was already imported.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactImportInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contact-imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: getContactImport
      summary: Get a contact import
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContactImport
      summary: Change the mapping or options and re-run the preview
      description: |
        Only while previewed. Row decisions start over.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactImportInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelContactImport
      summary: Cancel a previewed import (its row values are dropped)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/contact-imports/{importId}/rows:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: listContactImportRows
      summary: Preview / outcome rows, in source order
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: proposal
          schema: { $ref: '#/components/schemas/ImportProposal' }
        - in: query
          name: outcome
          schema: { $ref: '#/components/schemas/ImportOutcome' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedContactImportRows' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/contact-imports/{importId}/rows/{rowId}/resolution:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
      - $ref: '#/components/parameters/ImportRowId'
    put:
      operationId: resolveContactImportRow
      summary: Decide one row (create a contact, use an existing one, or skip it)
      description: |
        Rows proposed for review must be decided before commit. Repeated rows follow the row they repeat;
        invalid rows can only be skipped.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveContactImportRowInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/contact-imports/{importId}/commit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ImportId'
    post:
      operationId: commitContactImport
      summary: Apply the reviewed import
      description: |
        Creates contacts for create rows (re-checked against the matcher), links matched rows without changing those
        contacts, skips the rest. Idempotent and resumable: a completed import returns as is; an interrupted one
        continues. `createView` adds a live Contacts document filtered to this import (409 IMPORT_NEEDS_REVIEW while
        rows await a decision).
      tags: [workspaces]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitContactImportInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─── inventory import (doc/13 slice 4) ──────────────────────────────────────
  /workspaces/{workspaceId}/inventory-imports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listInventoryImports
      summary: Recent inventory imports (newest first, up to 50)
      tags: [workspaces]
