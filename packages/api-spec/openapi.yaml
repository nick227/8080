        displayName: { type: string, minLength: 1, maxLength: 120 }
        fromAddress: { type: string, maxLength: 254 }
        replyTo: { type: [string, 'null'], maxLength: 254 }
        smtp: { $ref: '#/components/schemas/SmtpSettings' }
        makeDefault: { type: boolean }

    DeleteEmailConnectionResponse:
