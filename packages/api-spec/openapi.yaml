    # ─── canonical contact import (doc/10 §7A) ───────────────────────────────
    ImportField:
      type: string
      enum: [firstName, lastName, displayName, title, email, phone, accountName, externalId]
      description: accountName links (or creates) the account with exactly that name; externalId needs options.externalProvider

    ImportProposal:
      type: string
      enum: [create, match, review, duplicate, invalid]

    ImportOutcome:
      type: string
      enum: [created, matched, skipped]

    ContactImportMapping:
      type: object
      description: 'Column id → contact field; each field at most once'
      maxProperties: 100
      additionalProperties: { $ref: '#/components/schemas/ImportField' }

    ContactImportOptions:
      type: object
      additionalProperties: false
      properties:
        ownerMemberId: { type: [string, 'null'], maxLength: 64, description: Owner of the contacts this import creates }
        tagIds:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        externalProvider: { type: [string, 'null'], maxLength: 32, description: 'Where externalId values come from (e.g. hubspot); matches by (provider, id) first' }

    CreateContactImportInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, csv, filename]
              properties:
                kind: { type: string, enum: [csv] }
                csv: { type: string, minLength: 1, maxLength: 600000 }
                filename: { type: string, minLength: 1, maxLength: 255 }
            - type: object
              additionalProperties: false
              required: [kind, documentId]
              properties:
                kind: { type: string, enum: [document] }
                documentId: { type: string, minLength: 1, maxLength: 64 }
        mapping: { $ref: '#/components/schemas/ContactImportMapping' }
        options: { $ref: '#/components/schemas/ContactImportOptions' }

    UpdateContactImportInput:
      type: object
      additionalProperties: false
      properties:
        mapping: { $ref: '#/components/schemas/ContactImportMapping' }
        options: { $ref: '#/components/schemas/ContactImportOptions' }

    ResolveContactImportRowInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [create, use, skip] }
        contactId: { type: string, minLength: 1, maxLength: 64, description: Required with use }

    CommitContactImportInput:
      type: object
      additionalProperties: false
      properties:
        createView: { type: boolean, description: Also create a live Contacts document showing what this import created }
        viewTitle: { type: string, minLength: 1, maxLength: 200 }

    ContactImportCounts:
      type: object
      properties:
        create: { type: integer }
        match: { type: integer }
        review: { type: integer }
        duplicate: { type: integer }
        invalid: { type: integer }
        unresolved: { type: integer, description: Review rows still waiting for a decision }
        created: { type: integer }
        matched: { type: integer }
        skipped: { type: integer }

    ContactImport:
      type: object
      required: [id, workspaceId, kind, status, source, columns, mapping, options, totalRows, counts, previousImportId, resultDocumentId, createdById, createdAt, committedAt, finishedAt, rowsPrunedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        kind: { type: string, enum: [contacts] }
        status: { type: string, enum: [previewed, committing, completed, cancelled] }
        source:
          type: object
          required: [kind, documentId, filename]
          properties:
            kind: { type: string, enum: [csv, document] }
            documentId: { type: [string, 'null'] }
            filename: { type: [string, 'null'] }
        columns:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        mapping: { $ref: '#/components/schemas/ContactImportMapping' }
        options:
          type: object
          additionalProperties: true
        totalRows: { type: integer }
        counts: { $ref: '#/components/schemas/ContactImportCounts' }
        previousImportId: { type: [string, 'null'], description: 'A completed import of the same table, if any' }
        resultDocumentId: { type: [string, 'null'], description: The live Contacts view created at commit }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        rowsPrunedAt: { type: [string, 'null'], format: date-time, description: Row values were dropped (retention); outcomes remain }

    ContactImportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ContactImport' }

    ContactImportList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContactImport' }

    ContactImportRow:
      type: object
      required: [id, rowNumber, sourceRowId, values, proposal, errorCode, candidates, proposedContactId, duplicateOfRow, resolution, resolvedContactId, outcome, outcomeNote, contact]
      properties:
        id: { type: string }
        rowNumber: { type: integer, description: 1-based data row in the source }
        sourceRowId: { type: [string, 'null'] }
        values:
          type: [object, 'null']
          additionalProperties: { type: string }
          description: Mapped field values; null once pruned
        proposal: { $ref: '#/components/schemas/ImportProposal' }
        errorCode: { type: [string, 'null'], description: 'INVALID_EMAIL, EMPTY_CONTACT, AMBIGUOUS_EMAIL, SHARED_ADDRESS' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ContactRef' }
        proposedContactId: { type: [string, 'null'] }
        duplicateOfRow: { type: [integer, 'null'] }
        resolution: { type: [string, 'null'], enum: [create, use, skip, null] }
        resolvedContactId: { type: [string, 'null'] }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/ImportOutcome'
            - type: 'null'
        outcomeNote: { type: [string, 'null'], description: 'e.g. MATCHED_AT_COMMIT, DUPLICATE_ROW, CONTACT_GONE, ACCOUNT_AMBIGUOUS' }
        contact:
          oneOf:
            - $ref: '#/components/schemas/ContactRef'
            - type: 'null'

    PaginatedContactImportRows:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContactImportRow' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    InventoryImportField:
      type: string
      enum: [name, sku, description, price, category, quantity, availability]

    InventoryImportMapping:
      type: object
