    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createMarketingBudget
      summary: Create a monthly marketing budget (a planning template; doc/13 §12, A3)
      description: |
        Four inputs, each with its own owner: the monthly amount (minor units, in the
        workspace currency), a goal and up to three channel priorities from fixed
        lists, and the business type (given, else the company profile). Code makes the
        split (whole percents summing to 100), the amounts (summing exactly to the
        budget) and the typed sheet; the model writes at most one short note per
        channel, without numbers. Private to its maker. Retry-safe by idempotencyKey.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMarketingBudgetInput' }
      responses:
        '201':
          description: The new budget sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

