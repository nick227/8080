    TaskStatus:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
      description: A status key from the workspace workflow (listTaskStatuses). Defaults are open, in_progress, in_review, done.
    TaskType:
      type: string
      enum: [task, feature, bug, story, epic]
    TaskPriority:
      type: string
      enum: [low, medium, high, highest]
    TaskAssignee:
      type: object
      required: [memberId, name, avatarUrl]
      properties:
        memberId: { type: string }
        name: { type: string }
        avatarUrl: { type: [string, 'null'] }
    Task:
      type: object
      required: [id, workspaceId, taskKey, number, title, description, status, issueType, area, priority, storyPoints, scheduledDate, scheduledTime, dueDate, assigneeMemberId, assignee, createdByMemberId, rank, version, commentCount, parentTaskId, checklist, source, resolvedAt, blocked, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        taskKey: { type: string, description: 'Readable key, e.g. VC-101' }
        number: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        issueType: { $ref: '#/components/schemas/TaskType' }
        area: { type: [string, 'null'] }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        storyPoints: { type: [integer, 'null'] }
        scheduledDate: { type: [string, 'null'], format: date }
        scheduledTime: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        assigneeMemberId: { type: [string, 'null'] }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/TaskAssignee'
            - type: 'null'
        createdByMemberId: { type: [string, 'null'] }
        rank: { type: number, description: Order inside the status column (ascending) }
        version: { type: integer, minimum: 1 }
        commentCount: { type: integer, minimum: 0 }
        parentTaskId: { type: [string, 'null'], description: The task this is a subtask of (one level) }
        checklist:
          type: object
          required: [done, total]
          properties:
            done: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        source: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time, description: When it last moved to done }
        blocked:
          oneOf:
            - $ref: '#/components/schemas/TaskBlocked'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskStreamEvent:
      type: object
      description: SDK-only typing for the streamTasks SSE payloads.
      required: [event]
      properties:
        event: { type: string, enum: [ready, task.changed, worklogs.changed, board.updated, workflow.updated, reset] }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/TaskStatusDef' }
        replayed: { type: boolean }
        activityId: { type: string }
        type: { type: string }
        actorMemberId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        taskId: { type: string }
        task:
          oneOf:
            - $ref: '#/components/schemas/Task'
            - type: 'null'
        wipLimits: { $ref: '#/components/schemas/WipLimits' }
        reason: { type: string }
    BulkTasksInput:
      type: object
      additionalProperties: false
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 64 }
        action: { type: string, enum: [update, delete, restore] }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        patch:
          type: object
          additionalProperties: false
          properties:
            status: { $ref: '#/components/schemas/TaskStatus' }
            priority: { $ref: '#/components/schemas/TaskPriority' }
            issueType: { $ref: '#/components/schemas/TaskType' }
            area: { type: [string, 'null'], maxLength: 64 }
            storyPoints: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
            dueDate: { type: [string, 'null'], format: date }
            scheduledDate: { type: [string, 'null'], format: date }
            assigneeMemberId: { type: [string, 'null'], maxLength: 64 }
            blocked:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 280 }
                - type: 'null'
