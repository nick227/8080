        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addTaskComment
      summary: Comment on a task
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTaskCommentInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCommentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/work-logs:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkLogs
      summary: Logged work, newest day first
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLogList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createWorkLog
      summary: Log work (optionally against a task, optionally closing it)
      description: completeTask moves the task to done in the same change; it needs taskId.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkLogInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLogResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/work-logs/import:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: importWorkLogs
      summary: Add many entries at once (entries saved in a browser)
      description: At most 500. taskKey links to a live task when one matches. Repeat with the same idempotencyKey to get the first result back.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportWorkLogsInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLogList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/work-logs/{workLogId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkLogId'
    delete:
      operationId: deleteWorkLog
      summary: Delete an entry (its author, the member it credits, or an admin)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/task-statuses:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listTaskStatuses
      summary: The workspace's task workflow (statuses = board columns), in order, archived last
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTaskStatuses
      summary: Replace the workflow (admins)
      description: |
        Statuses in the new order. A listed `key` must be an existing status (keys never
        change); entries without a key are new. An existing status left out is archived.
        Keep at least one active todo and one active done status (400 INVALID_WORKFLOW).
        A status archived while it still has tasks needs `reassign[key]` = an active status
        to move them to (400 STATUS_IN_USE otherwise); each moved task gets a history line.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskStatusesInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/task-board:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getTaskBoard
      summary: Board settings (WIP limits)
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBoardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTaskBoard
      summary: Set WIP limits (admins)
      description: Replaces every limit. Leave a column out (or null) for no limit.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskBoardInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBoardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/task-notifications:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getTaskNotificationSettings
      summary: The caller's task notification channels
      description: Every task notification reaches For you; email is per member.
      tags: [workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNotificationSettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTaskNotificationSettings
      summary: Choose which task notifications the caller also gets by email
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskNotificationSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNotificationSettingsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token. Web clients send it as the httpOnly `token` cookie; native clients as a Bearer header.

  parameters:
    Cursor:
      in: query
      name: cursor
      schema: { type: string, maxLength: 512 }
      description: Opaque cursor returned by the previous page.
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQuery:
      in: query
      name: q
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: Simple text search within this resource.
    RoomId:
      in: path
      name: roomId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    EmailConnectionId:
      in: path
      name: connectionId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AgentId:
      in: path
      name: agentId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AgentEventId:
      in: path
      name: eventId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ItemId:
      in: path
      name: itemId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ReactionTypeParam:
      in: path
      name: type
      required: true
      schema: { $ref: '#/components/schemas/ReactionType' }

    DocumentId:
      in: path
      name: documentId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ProposalId:
      in: path
      name: proposalId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    MemberId:
      in: path
      name: memberId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      description: A WorkspaceMember id (not a user id)
    TeamId:
      in: path
      name: teamId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ContactId:
      in: path
      name: contactId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    TaskId:
      in: path
      name: taskId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    WorkLogId:
      in: path
      name: workLogId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ChecklistItemId:
      in: path
      name: itemId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    InventoryId:
      in: path
      name: inventoryId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    RecordImageId:
      in: path
      name: imageId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    TagId:
      in: path
      name: tagId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    NoteId:
      in: path
      name: noteId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    LinkId:
      in: path
      name: linkId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string, minLength: 1, maxLength: 120 }
      description: Repeating a succeeded request with the same key returns its result instead of acting twice; reusing a key for a different request is 409 IDEMPOTENCY_KEY_REUSED.

    ImportId:
      in: path
      name: importId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ImportRowId:
      in: path
      name: rowId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Unsupported file type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ─── shared ──────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    NullResponse:
      type: object
      required: [data]
      properties:
        data: { type: 'null' }

    PaginatedMeta:
      type: object
      required: [hasMore, nextCursor]
      properties:
        changeCursor: { type: string, description: Durable room change sequence for item pages }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
        total: { type: integer, minimum: 0, description: Full filtered count when the list endpoint provides it }

    # ─── users ───────────────────────────────────────────────────────────────
    UserKind:
      type: string
      enum: [human, bot]
      description: Data for data-layer rules (human-authored activity, doc/08 I6). Components render `tag`, never branch on this.

    User:
      type: object
      required: [id, email, isGuest, kind, tag, displayName, avatarUrl, createdAt]
      properties:
        id: { type: string }
        email: { type: [string, 'null'] }
        isGuest: { type: boolean }
        kind: { $ref: '#/components/schemas/UserKind' }
        tag: { type: [string, 'null'], description: 'Short disclosure suffix shown after the name, e.g. BOT; null for people' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    GuestInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }

    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 50 }

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }

    UpdateMeInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        avatarUrl: { type: [string, 'null'], maxLength: 512 }

    UploadAvatarInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }

    Author:
      type: object
      required: [id, name, avatarUrl, kind, tag]
      properties:
        id: { type: string }
        name: { type: string }
        avatarUrl: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/UserKind' }
        tag: { type: [string, 'null'], description: 'Short disclosure suffix shown after the name, e.g. BOT; null for people' }

    ParticipantRole:
      type: string
      enum: [owner, member, bot]

    Participant:
      type: object
      required: [user, role, present]
      properties:
        user: { $ref: '#/components/schemas/Author' }
        role: { $ref: '#/components/schemas/ParticipantRole' }
        present: { type: boolean, description: Connected to this room now (deduplicated; a refresh does not flip it) }

    AuthorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Author' }

    AuthorResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Author' }

    RoomBot:
      type: object
      required: [user, handle, kind, seated]
      properties:
        user: { $ref: '#/components/schemas/Author' }
        handle: { type: string }
        kind: { type: string, enum: [house, optional], description: 'house = seated by default; optional = only when added' }
        seated: { type: boolean }

    RoomBotList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RoomBot' }

    RoomBotResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RoomBot' }

    ParticipantList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Participant' }

    # ─── rooms ───────────────────────────────────────────────────────────────
    RoomVisibility:
      type: string
      enum: [public, private]

    RoomRole:
      type: string
      enum: [owner, member]

    Room:
      type: object
      required:
        [id, number, title, description, thumbnail, topic, visibility, ownerId, itemCount, responseCount, durationMs, memberCount, lastActivityAt, createdAt, role, inviteCode]
      properties:
        id: { type: string }
        number: { type: integer, description: 'Human-facing room sequence ("CONVERSATION 018")' }
        title: { type: string }
        description: { type: string }
        thumbnail:
          description: Conversation image
          oneOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
        topic: { type: [string, 'null'] }
        visibility: { $ref: '#/components/schemas/RoomVisibility' }
        ownerId: { type: string }
        itemCount: { type: integer }
        responseCount: { type: integer, description: Live items after the opening one }
        durationMs: { type: integer, description: Total audio/video time of the live items (ms) }
        memberCount: { type: integer }
        lastActivityAt: { type: string, format: date-time }
        lastResponseAt: { type: [string, 'null'], format: date-time, description: 'Newest live item after the opening one; null when there is none' }
        createdAt: { type: string, format: date-time }
        role:
          description: The caller's membership role, or null if not a member
          oneOf:
            - $ref: '#/components/schemas/RoomRole'
            - type: 'null'
        inviteCode:
          type: [string, 'null']
          description: Present only for members of a private room

    LiveToken:
      type: object
      required: [token, url, room, canPublish, expiresAt]
      properties:
        token: { type: string, description: LiveKit access token (JWT) }
        url: { type: string, description: LiveKit server URL to connect to }
        room: { type: string, description: 'LiveKit room name (= the app room id)' }
        canPublish: { type: boolean, description: May publish camera and screen share }
        expiresAt: { type: string, format: date-time }

    LiveTokenResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LiveToken' }

    RoomResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Room' }

    PaginatedRooms:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Room' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }

    CreateRoomInput:
      type: object
      additionalProperties: false
      description: Every field is optional; a conversation may have no name, description or thumbnail.
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        thumbnailId:
          type: string
          minLength: 1
          maxLength: 64
          description: The caller's own image, or a YouTube video they added. 400 INVALID_THUMBNAIL otherwise.
        topic: { type: string, minLength: 1, maxLength: 40 }
        visibility: { $ref: '#/components/schemas/RoomVisibility' }

    UpdateRoomInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        thumbnailId: { type: string, minLength: 1, maxLength: 64 }
        topic: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        visibility: { $ref: '#/components/schemas/RoomVisibility' }

    JoinRoomInput:
      type: object
      additionalProperties: false
      properties:
        inviteCode: { type: string, minLength: 1, maxLength: 32 }

    # ─── items ───────────────────────────────────────────────────────────────
    MediaType:
      type: string
      enum: [audio, video, image, file]

    Media:
      type: object
      required: [id, type, source, url, mimeType, size, duration, name, poster, externalId, title, embeddable]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/MediaType' }
        source:
          type: string
          enum: [stored, youtube]
          description: stored = our upload/capture; youtube = external video (never downloaded)
        url: { type: string }
        mimeType: { type: string }
        size: { type: integer, description: Bytes }
        duration: { type: [number, 'null'], description: Seconds (audio/video) }
        name: { type: [string, 'null'] }
        poster: { type: [string, 'null'], description: Poster image URL (video) }
        externalId: { type: [string, 'null'], description: Canonical YouTube video id (source youtube) }
        title: { type: [string, 'null'], description: External title (source youtube) }
        embeddable:
          type: boolean
          description: Whether the media can be played inline. Non-embeddable YouTube shows a link card; its duration is null, so it cannot be anchored.

    MediaResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Media' }

    UploadMediaInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        type:
          $ref: '#/components/schemas/MediaType'
          description: Defaults from the file's mime type
        name: { type: string, maxLength: 255 }
        duration: { type: number, minimum: 0 }

    ReactionType:
      type: string
      enum: [like, ack, laugh]

    ReactionSummary:
      type: object
      required: [type, count, reacted]
      properties:
        type: { $ref: '#/components/schemas/ReactionType' }
        count: { type: integer, minimum: 1 }
        reacted: { type: boolean, description: Whether the caller has this reaction }

    Message:
      type: object
      description: Reusable content (author, text, media). Hydrated on every Item.
      required: [id, author, text, media, actions, choice, links, createdAt]
      properties:
        id: { type: string }
        author: { $ref: '#/components/schemas/Author' }
        text: { type: [string, 'null'], description: Null when the Item placement is deleted }
        media:
          type: array
          description: Empty when the Item placement is deleted
          items: { $ref: '#/components/schemas/Media' }
        actions:
          description: A choice a bot offers on this message (doc/12 §4). Null for every human message, and when hidden.
          oneOf:
            - $ref: '#/components/schemas/ChoiceActions'
            - type: 'null'
        choice:
          description: The answer to `actions` once someone chose (first choice wins); null while open.
          oneOf:
            - $ref: '#/components/schemas/Choice'
            - type: 'null'
        links:
          type: array
          description: Things a bot message points at (doc/12 §5.4), e.g. a document it created. Empty for human messages and when hidden.
          items: { $ref: '#/components/schemas/MessageLink' }
        createdAt: { type: string, format: date-time }

    ProposalDiffRow:
      type: object
      required: [label, before, after]
      properties:
        label: { type: string }
        before: { type: string, description: Empty when there was nothing }
        after: { type: string }
        key: { type: string, description: Present when the row can be edited (editProposal) under this name }
        value: { type: string, description: 'The raw value to edit (e.g. 2026-10-09 for Fri, Oct 9)' }
        quote: { type: string, description: "The source's own words this row came from (doc/13 §10 rule 10)" }

    Proposal:
      type: object
      description: A typed change to one record, applied only on a click (doc/13 §5). Chat and record pages render this same object.
      required: [id, kind, targetType, targetId, status, title, diff, baseVersion, createdAt, expiresAt, decidedAt, decidedBy, requires, editable, revertible]
      properties:
        id: { type: string }
        kind: { type: string, description: 'Registered handler, e.g. company-profile.fact' }
        targetType: { type: string }
        targetId: { type: string }
        status: { type: string, enum: [pending, applied, dismissed, expired, undone] }
        title: { type: string }
        diff: { type: array, items: { $ref: '#/components/schemas/ProposalDiffRow' } }
        baseVersion: { type: integer, description: The record version it was proposed against }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], description: 'Who applied, dismissed or undid it' }
        requires: { type: string, enum: [admin, member], description: Who may apply it (the server still decides) }
        editable: { type: boolean, description: Its kind can be edited before Apply }
        revertible: { type: boolean, description: Its kind can propose putting an applied change back }

    ProposalResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Proposal' }

    ProposalList:
      type: object
